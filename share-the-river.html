<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Share the River — Water in the World</title>
<style>
  /* Suite family with the Vocab Hub: warm paper, Georgia display, river teal
     primary + ochre secondary. Adds an assessment layer coloured by the
     school continuum band: support (amber), at-standard (teal), extend (indigo). */
  :root{
    --bg:#f2ece0; --paper:#fbf7ef; --ink:#211d17; --muted:#6c6353;
    --line:#d9cfb9; --line-soft:#e8e0ce;
    --water:#2c7488; --water-d:#215866;
    --earth:#b0741f; --earth-d:#8f5d16;
    --correct:#2f6a3e; --wrong:#a8432f;
    --okbg:#eef4ec; --badbg:#f6ece8;
    /* four values the student is balancing */
    --farm:#b0741f; --farmbg:#f4ead7;
    --town:#7a4a6f; --townbg:#f1e6ee;
    --river:#2c7488; --riverbg:#e6f0f1;
    --culture:#3f7a4a; --culturebg:#e6f1e8;
    /* continuum bands */
    --support:#b06a1f; --supportbg:#f6ead6;
    --core:#2c7488; --corebg:#e2edf0;
    --extend:#4a4a86; --extendbg:#e8e7f3;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:var(--bg);
       min-height:100vh;padding:16px;display:flex;justify-content:center;align-items:flex-start;color:var(--ink)}
  .container{background:var(--paper);border:1px solid var(--line);border-radius:12px;
       max-width:940px;width:100%;padding:24px;margin-top:12px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
  h1{text-align:center;font-size:24px;font-family:Georgia,'Times New Roman',serif;letter-spacing:.3px}
  h2{font-family:Georgia,serif;font-size:19px;margin:4px 0 10px}
  h3{font-family:Georgia,serif;font-size:15px;margin:16px 0 8px}
  .subtitle{color:var(--muted);text-align:center;margin:6px 0 16px;font-size:13px}
  .muted{color:var(--muted);font-size:13px;line-height:1.55}
  .screen{display:none}.screen.active{display:block}
  button{font-family:inherit}
  .btn{padding:11px 18px;border:1px solid var(--line);border-radius:8px;font-size:15px;font-weight:600;
       cursor:pointer;background:var(--paper);color:var(--ink);transition:all .15s ease}
  .btn-primary{background:var(--water);color:#fff;border-color:var(--water)}
  .btn-primary:hover:not(:disabled){background:var(--water-d)}
  .btn-primary:disabled{background:var(--line);border-color:var(--line);color:var(--muted);cursor:not-allowed}
  .btn-ghost{background:var(--bg);color:var(--muted)}
  .btn-ghost:hover{color:var(--ink);border-color:var(--ink)}
  .linkbtn{background:none;border:none;color:var(--water-d);font-weight:600;font-size:13px;cursor:pointer;padding:4px 8px}
  .linkbtn:hover{text-decoration:underline}
  button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:3px solid var(--water);outline-offset:2px}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}

  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .progress{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.4px}
  .brief{background:var(--bg);border:1px solid var(--line-soft);border-left:4px solid var(--water);
       border-radius:8px;padding:14px 16px;margin:12px 0;font-size:14px;line-height:1.6}
  .brief b{color:var(--water-d)}
  .rolebox{border:1px solid var(--line);border-radius:10px;padding:16px;margin:12px 0;background:var(--paper)}
  .note{font-size:12px;color:var(--muted);font-style:italic;line-height:1.5;margin-top:10px}

  /* ---- season header ---- */
  .seasonhead{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:8px;
       border-bottom:2px solid var(--line-soft);padding-bottom:8px;margin-bottom:12px}
  .seasonhead .s-name{font-family:Georgia,serif;font-size:20px;font-weight:700}
  .seasonhead .s-sub{color:var(--muted);font-size:13px}
  .seasonhead .s-count{font-size:12px;font-weight:700;color:var(--muted)}

  /* ---- map ---- */
  .mapwrap{border:1px solid var(--line-soft);border-radius:10px;background:#eaf1f2;padding:10px;margin-bottom:10px}
  .mapwrap svg{width:100%;height:auto;display:block}
  .layerbtns{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
  .lbtn{cursor:pointer;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--bg);
       border-radius:16px;padding:6px 13px;color:var(--muted)}
  .lbtn.on{background:var(--paper);border-color:var(--water);color:var(--water-d)}
  .lbtn .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
  .mapcap{font-size:12.5px;color:var(--muted);background:var(--bg);border-radius:6px;padding:8px 11px;min-height:34px;line-height:1.5}

  /* ---- allocation ---- */
  .budget{display:flex;align-items:center;gap:12px;background:var(--bg);border:1px solid var(--line);
       border-radius:10px;padding:12px 14px;margin:10px 0;flex-wrap:wrap}
  .budget .lab{font-weight:700;font-size:14px}
  .budget .bar{flex:1;min-width:160px;height:14px;background:var(--line-soft);border-radius:99px;overflow:hidden}
  .budget .fill{height:100%;background:var(--water);border-radius:99px;transition:width .25s}
  .budget .num{font-family:Georgia,serif;font-weight:700;font-size:16px;white-space:nowrap}
  .budget .num.over{color:var(--wrong)}
  .allocgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
  @media(max-width:620px){.allocgrid{grid-template-columns:1fr}}
  .alloc{border:1px solid var(--line-soft);border-radius:10px;padding:12px 14px;background:var(--paper);border-left:5px solid}
  .alloc.farm{border-left-color:var(--farm)} .alloc.town{border-left-color:var(--town)}
  .alloc.river{border-left-color:var(--river)} .alloc.culture{border-left-color:var(--culture)}
  .alloc .a-top{display:flex;align-items:center;gap:8px}
  .alloc .a-name{font-weight:700;font-size:14.5px}
  .alloc .a-who{font-size:11.5px;color:var(--muted);margin-left:auto}
  .alloc .a-desc{font-size:12px;color:var(--muted);line-height:1.5;margin:6px 0 8px}
  .stepper{display:flex;align-items:center;gap:10px}
  .stepper button{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--bg);
       font-size:20px;font-weight:800;cursor:pointer;color:var(--ink)}
  .stepper button:hover:not(:disabled){border-color:var(--water)}
  .stepper button:disabled{opacity:.35;cursor:not-allowed}
  .stepper .val{font-family:Georgia,serif;font-size:20px;font-weight:700;min-width:44px;text-align:center}
  .stepper .need{font-size:11px;color:var(--muted);margin-left:4px}
  .needbar{height:6px;background:var(--line-soft);border-radius:99px;overflow:hidden;margin-top:8px}
  .needbar span{display:block;height:100%;border-radius:99px;transition:width .25s}
  .alloc.farm .needbar span{background:var(--farm)} .alloc.town .needbar span{background:var(--town)}
  .alloc.river .needbar span{background:var(--river)} .alloc.culture .needbar span{background:var(--culture)}

  /* ---- stakeholders ---- */
  .stakes{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
  .stake{flex:1 1 190px;border:1px solid var(--line-soft);border-radius:9px;padding:9px 11px;background:var(--paper)}
  .stake .st-top{display:flex;align-items:center;gap:8px}
  .stake .st-name{font-size:12.5px;font-weight:700}
  .stake .st-mood{margin-left:auto;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;
       padding:2px 7px;border-radius:11px;color:#fff}
  .stake .st-role{font-size:11px;color:var(--muted);font-style:italic;margin-top:1px}
  .stake .st-bar{height:6px;background:var(--line-soft);border-radius:99px;overflow:hidden;margin-top:6px}
  .stake .st-bar span{display:block;height:100%;border-radius:99px;transition:width .4s}
  .stake .st-line{font-size:11.5px;color:var(--ink);margin-top:6px;line-height:1.4}

  /* ---- meters (the four values) ---- */
  .meters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
  @media(max-width:620px){.meters{grid-template-columns:1fr}}
  .meter{border:1px solid var(--line-soft);border-radius:8px;padding:8px 11px;background:var(--paper)}
  .meter .m-top{display:flex;justify-content:space-between;font-size:12px;font-weight:700}
  .meter .m-track{height:9px;background:var(--line-soft);border-radius:99px;overflow:hidden;margin:5px 0 2px}
  .meter .m-fill{height:100%;border-radius:99px;transition:width .5s}
  .meter.farm .m-fill{background:var(--farm)} .meter.town .m-fill{background:var(--town)}
  .meter.river .m-fill{background:var(--river)} .meter.culture .m-fill{background:var(--culture)}
  .meter .m-delta{font-size:11px;font-weight:700}
  .m-delta.up{color:var(--correct)} .m-delta.down{color:var(--wrong)}

  /* ---- assessment task shell ---- */
  .taskcard{border:1px solid var(--line);border-radius:10px;padding:16px;margin:12px 0;background:var(--paper)}
  .bandtag{display:inline-block;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;
       padding:3px 10px;border-radius:20px;margin-bottom:8px}
  .bandtag.support{color:var(--support);background:var(--supportbg)}
  .bandtag.core{color:var(--core);background:var(--corebg)}
  .bandtag.extend{color:var(--extend);background:var(--extendbg)}
  .strandtag{font-size:11px;font-weight:700;color:var(--muted);margin-left:6px}
  .qtext{font-size:16px;line-height:1.6;margin:6px 0 12px}
  .scaffold{background:var(--supportbg);border:1px solid #e2c79a;border-radius:8px;padding:10px 13px;margin:8px 0;font-size:13px;line-height:1.55}
  .scaffold b{color:var(--support)}
  .stretchbox{background:var(--extendbg);border:1px solid #c3c1e0;border-radius:8px;padding:10px 13px;margin:8px 0;font-size:13px;line-height:1.55}
  .stretchbox b{color:var(--extend)}
  .opts{display:flex;flex-direction:column;gap:8px}
  .opt{padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--paper);font-size:14.5px;
       text-align:left;cursor:pointer;line-height:1.5}
  .opt:hover:not(:disabled){border-color:var(--water)}
  .opt:disabled{cursor:default}
  .opt.right{background:var(--okbg);border-color:var(--correct);color:var(--correct);font-weight:600}
  .opt.wrongpick{background:var(--badbg);border-color:var(--wrong);color:var(--wrong)}
  .feedback{margin-top:12px;padding:12px 14px;border-radius:8px;font-size:13.5px;line-height:1.55;display:none}
  .feedback.ok{display:block;background:var(--okbg);border:1px solid var(--correct)}
  .feedback.bad{display:block;background:var(--badbg);border:1px solid var(--wrong)}
  .writeframe{width:100%;font-family:inherit;font-size:14px;padding:11px;border:1px solid var(--line);
       border-radius:8px;background:var(--paper);color:var(--ink);resize:vertical;min-height:70px;margin-top:8px}
  .writeframe:focus{outline:none;border-color:var(--water)}
  .nextrow{margin-top:14px;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}

  /* ---- level flag ---- */
  .levelflag{display:flex;align-items:center;gap:10px;font-size:12.5px;padding:9px 12px;border-radius:8px;margin:6px 0}
  .levelflag.support{background:var(--supportbg)} .levelflag.core{background:var(--corebg)} .levelflag.extend{background:var(--extendbg)}
  .levelflag .lf-i{font-size:16px}

  /* ---- self-assessment ladder ---- */
  .ladder{display:flex;flex-direction:column;gap:6px;margin:10px 0}
  .rung{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line-soft);border-radius:8px;
       padding:10px 12px;background:var(--paper);cursor:pointer;text-align:left;width:100%}
  .rung:hover{border-color:var(--water)}
  .rung.picked{border-color:var(--water);background:var(--riverbg)}
  .rung.evid{box-shadow:inset 4px 0 0 var(--core)}
  .rung .r-lvl{font-family:Georgia,serif;font-weight:800;font-size:13px;color:var(--muted);flex-shrink:0;width:58px}
  .rung .r-txt{font-size:13px;line-height:1.45}
  .rung .r-tags{display:block;margin-top:3px;font-size:10.5px;font-weight:700}
  .r-mine{color:var(--water-d)} .r-app{color:var(--extend)}

  /* ---- report ---- */
  .sumbox{border:1px solid var(--line);border-radius:10px;padding:16px;margin:12px 0;text-align:center}
  .sumbox .big{font-family:Georgia,serif;font-size:34px;font-weight:700}
  .repgrid{width:100%;border-collapse:collapse;margin:10px 0}
  .repgrid th,.repgrid td{border:1px solid var(--line);padding:8px 10px;font-size:13px;text-align:left;vertical-align:top}
  .repgrid th{background:var(--bg);font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted)}
  .repgrid .lvl{font-family:Georgia,serif;font-weight:700;white-space:nowrap}
  .idrow{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0;align-items:flex-end}
  .idrow label{font-size:12px;font-weight:700;color:var(--muted);display:block;margin-bottom:4px}
  .idrow input{padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:15px;font-family:inherit;background:#fff}
  .vcode{font-family:'Courier New',monospace;font-size:13px;letter-spacing:2px}
  .band-key{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;margin:6px 0 2px}
  .band-key span{display:inline-flex;align-items:center;gap:5px;font-weight:700}
  .band-key i{width:12px;height:12px;border-radius:3px;display:inline-block}
  @media print{
    body{background:#fff;padding:0}
    .container{border:none;box-shadow:none;max-width:100%;padding:6px}
    .noprint{display:none !important}
  }
</style>
</head>
<body>
<div class="container">

<div class="screen active" id="scr-intro"></div>
<div class="screen" id="scr-season">
  <div class="topbar noprint"><button class="linkbtn" onclick="quitToIntro()">&larr; restart</button><span class="progress" id="season-prog"></span></div>
  <div id="season-body"></div>
</div>
<div class="screen" id="scr-selfassess">
  <div class="topbar noprint"><span></span><span class="progress">SELF-ASSESSMENT</span></div>
  <div id="selfassess-body"></div>
</div>
<div class="screen" id="scr-report">
  <div class="topbar noprint"><button class="linkbtn" onclick="go('intro')">&larr; play again</button><span class="progress">REPORT</span></div>
  <div id="report-body"></div>
</div>

</div>
<script>
"use strict";
/* ============================================================
   SHARE THE RIVER — a Murray–Darling allocation simulation
   Companion to the Year 7 "Water in the World" unit.

   THE DESIGN, IN ONE LINE: a concrete, accessible core task
   (divide a shrinking river between four users, four seasons)
   with an ASSESSMENT LAYER laid on top that follows the school's
   Geography continuum. Every season the student meets a short
   task on one continuum strand (Map & Data, Challenges, or
   Interconnection), served at THEIR current level. The engine:
     • pitches the core at Levels 7–8 (Years 7–8);
     • FLAGS + SUPPORTS students working at Level 6 (Years 5–6)
       with scaffolds, sentence starters and simpler framing;
     • FLAGS + EXTENDS students working at Levels 9–10
       (Years 9–10) with criteria, scale/time and justification.
   It closes with SELF-ASSESSMENT against the school's exact
   "I can…" ladder, shows the app's evidence beside the
   student's own rating, and prints a report keyed to the
   continuum. Place is a fictionalised reach of the Murray–
   Darling Basin; stakeholders are role archetypes, not real
   individuals.
   ============================================================ */
/* ============================================================
   SCHOOL LEARNING CONTINUUM (Geography self-assessment ladders)
   Verbatim "I can…" statements, Levels 6–11, exactly as used in
   the unit's self-assessment. Level→year-band mapping:
     Level 6  = Years 5–6  (working towards)
     Levels 7–8 = Years 7–8 (at standard — the core target)
     Levels 9–10 = Years 9–10 (extending)
     Level 11 = beyond
   ============================================================ */
const CONTINUUM = {
  mapdata: { code:"2.1 Map & Data Analyses", name:"Reading the map & data",
    rungs:{
      6:"I can identify the key features of a map (BOLTSS).",
      7:"I can use geographical language to interpret increases, decreases or trends in maps, graphs, charts or tables.",
      8:"I can describe patterns, quantify them, and point out exceptions in maps, graphs, charts or tables (PQE).",
      9:"I can use social, historical, environmental, economic, political or technological factors (SHEEPT) to explain trends.",
      10:"I can analyse relationships between multiple sources of geographical data.",
      11:"I can analyse and draw reasoned conclusions from independently collected sources of geographical data." } },
  challenges: { code:"1.3 Challenges", name:"Responding to the challenge",
    rungs:{
      6:"I can identify responses to a geographical challenge.",
      7:"I can identify and compare strategies to respond to a geographical challenge.",
      8:"I can compare strategies to respond to a geographical challenge and predict the likely outcomes.",
      9:"I can evaluate alternative views and strategies to respond to a geographical challenge.",
      10:"I can evaluate alternative views and responses to a geographical challenge and explain the predicted outcomes.",
      11:"I can evaluate alternative views and responses to a geographical challenge and draw a conclusion about the most effective response." } },
  interconnection: { code:"1.2 Interconnection", name:"Connections between places & people",
    rungs:{
      6:"I can identify how places, people and environments are connected.",
      7:"I can identify interconnections within and between places, people and environments.",
      8:"I can describe interconnections within and between places, people and environments.",
      9:"I can explain interconnections within and between places, people and environments over time and at different scales.",
      10:"I can analyse interconnections within and between places, people and environments over time and at different scales.",
      11:"I can synthesise multiple data sources to analyse interconnections within and between places, people and environments." } },
};
function bandOf(level){ return level<=6 ? "support" : (level<=8 ? "core" : "extend"); }
function bandLabel(level){ return level<=6 ? "Working towards · Years 5–6" : (level<=8 ? "At standard · Years 7–8" : "Extending · Years 9–10"); }
const BAND_ICON={support:"⛺",core:"⚑",extend:"⛰"};

/* ============================================================
   THE PLACE — a fictionalised reach of the Murray–Darling Basin.
   Four users share the river, upstream → downstream.
   ============================================================ */
const BUCKETS = [
  { key:"farm", cls:"farm", name:"Irrigated farms", who:"upstream", need:9,
    desc:"Cotton and citrus growers. Water here means jobs and export income for the district.",
    meter:"Farm economy" },
  { key:"town", cls:"town", name:"Willow Bend township", who:"midstream", need:4,
    desc:"3,000 people: drinking water, hospital, homes, small industry. Needs a reliable minimum.",
    meter:"Town wellbeing" },
  { key:"river", cls:"river", name:"Environmental flow", who:"the wetland", need:6,
    desc:"Keeps the river and its Ramsar wetland alive — fish, birds, red-gums. Too little and it sickens.",
    meter:"River health" },
  { key:"culture", cls:"culture", name:"Cultural flow", who:"First Nations custodians", need:3,
    desc:"Keeps the sacred waterhole (billabong) full and Country healthy. A minimum each season stops it drying.",
    meter:"Cultural & spiritual value" },
];
const WATERHOLE_MIN = 1; // cultural flow below this dries the billabong

const STAKES = [
  { key:"farm", name:"Dai N.", role:"Cotton grower", link:"farm",
    happy:"“Good on ya — that allocation keeps pickers in work.”",
    ok:"“It'll do, but the crop's thirsty.”",
    unhappy:"“Cut like that and I lay people off. That's real.”" },
  { key:"town", name:"Mayor Ellis", role:"Willow Bend council", link:"town",
    happy:"“Taps on, hospital running. Thank you.”",
    ok:"“We're managing — just.”",
    unhappy:"“The town can't run on this. People come first.”" },
  { key:"river", name:"Priya R.", role:"River ecologist", link:"river",
    happy:"“The wetland's breathing. Birds are back on the lignum.”",
    ok:"“Hanging on, but stressed.”",
    unhappy:"“Pull much more and we'll see fish kills and blue-green algae.”" },
  { key:"culture", name:"Aunty Marion", role:"First Nations custodian", link:"culture",
    happy:"“The waterhole's alive. We belong to this river — thank you for keeping it.”",
    ok:"“It's holding, but Country needs more than this.”",
    unhappy:"“The billabong's drying. That's a living place, and a sacred one.”" },
];

/* seasons: inflow (GL) available to share, shrinking then a wet pulse */
const SEASONS = [
  { name:"Summer", sub:"The dry sets in", inflow:16,
    intro:"A hot, dry summer. There's less water than everyone's asked for. How you read the river now sets up the whole year.",
    event:"The Bureau warns an <b>El Niño</b> is likely — expect a hotter, drier year." },
  { name:"Autumn", sub:"El Niño confirmed", inflow:12,
    intro:"El Niño is confirmed. Inflow has dropped again. Every decision now has winners and losers.",
    event:"A heatwave pushes up town demand and evaporation from the dam." },
  { name:"Winter", sub:"Deep drought", inflow:9,
    intro:"The driest winter on record for the reach. The river is barely flowing past the town.",
    event:"An upstream irrigator is caught taking more than their licence — 'water theft' hits the news." },
  { name:"Spring", sub:"A wet pulse", inflow:15,
    intro:"Rain in the northern catchment sends a pulse downstream. A chance to help the river recover — if you choose to.",
    event:"La Niña signs appear: the drought may be breaking." },
];

/* ============================================================
   ASSESSMENT BANKS — laddered by continuum level (6–10).
   Each item: {id, q, opts, a, explain, scaffold?, stretch?}
   scaffold = extra support shown in the Level-6 (Years 5–6) band.
   stretch  = a free-response justification prompt added in the
              Level 9–10 (Years 9–10) band.
   ============================================================ */
const QBANKS = {
  mapdata: {
    6:[{ id:"md6a",
      q:"This season's inflow is measured at four weirs, upstream → downstream: <b>Weir A 16 GL, Weir B 11, Weir C 7, Weir D 4</b>. Which weir has the <b>most</b> water?",
      opts:["Weir A","Weir B","Weir C","Weir D"], a:"Weir A",
      explain:"Reading values off a map or table is the first BOLTSS skill — 16 is the largest number, so Weir A has the most.",
      scaffold:"<b>Tip:</b> 'the most' means the biggest number. Line the four up and find the largest." }],
    7:[{ id:"md7a",
      q:"Inflow along the river reads <b>16, 11, 7, 4 GL</b> from upstream to downstream. Using geographical language, the trend is that water…",
      opts:["decreases downstream","increases downstream","stays the same","changes randomly"], a:"decreases downstream",
      explain:"'Decreases downstream' names the trend with directional, geographical language — exactly the Level-7 skill." }],
    8:[{ id:"md8a",

function stepAlloc(key,d){
  const se=SEASONS[S.seasonIdx];
  const remaining=se.inflow - sum(S.alloc);
  if(d>0 && remaining<=0) return;
  S.alloc[key]=clamp((S.alloc[key]||0)+d, 0, se.inflow);
  refreshAlloc();
}
function refreshAlloc(){
  const se=SEASONS[S.seasonIdx];
  const used=sum(S.alloc); const remaining=se.inflow-used;
  BUCKETS.forEach(b=>{
    document.getElementById("val-"+b.key).textContent=S.alloc[b.key]||0;
    document.getElementById("need-"+b.key).style.width=Math.min(100,100*(S.alloc[b.key]||0)/b.need)+"%";
    document.getElementById("plus-"+b.key).disabled = remaining<=0;
  });
  document.getElementById("budfill").style.width=(100*remaining/se.inflow)+"%";
  const num=document.getElementById("budnum"); num.textContent=`${remaining} / ${se.inflow} GL`;
  num.classList.toggle("over", remaining<0);
}

/* ================= CONSEQUENCE (apply the allocation) ================= */
function lockAllocation(){
  const se=SEASONS[S.seasonIdx];
  const used=sum(S.alloc), remaining=se.inflow-used, extraction=used/se.inflow;
  S.lastDelta={};
  BUCKETS.forEach(b=>{
    let ratio=Math.min(1,(S.alloc[b.key]||0)/b.need);
    let target=100*ratio;
    if(b.key==="river"){ target += Math.min(16, remaining*5); if(extraction>0.92) target-=18; }
    if(b.key==="town" && (S.alloc.town||0) < b.need*0.6) target-=26;
    if(b.key==="culture" && (S.alloc.culture||0) < WATERHOLE_MIN){ target=Math.min(target,22); S.waterholeDry=true; }
    target=clamp(target,0,100);
    const before=S.meters[b.key];
    S.meters[b.key]=Math.round(0.45*before + 0.55*target);
    S.lastDelta[b.key]=S.meters[b.key]-before;
  });
  runSeasonTasks(0);
}

/* ================= ASSESSMENT TASKS (the continuum layer) ================= */
function pickItem(strand){
  const lv=clamp(S.levels[strand],6,10);
  const bank=QBANKS[strand][lv]||QBANKS[strand][8];
  const unused=bank.filter(it=>S.used[strand].indexOf(it.id)<0);
  const it=(unused.length?unused:bank)[0];
  S.used[strand].push(it.id);
  return {it, servedLevel:lv};
}
function runSeasonTasks(ti){
  const strands=SEASON_TASKS[S.seasonIdx];
  if(ti>=strands.length){ showConsequence(); return; }
  const strand=strands[ti];

  S.seen[strand]=S.seen[strand]||[]; S.seen[strand].push(band);
  const mount=document.getElementById("season-body");

  mount.innerHTML=`
    <div class="seasonhead"><div><div class="s-name">${esc(SEASONS[S.seasonIdx].name)} · thinking task</div>

    <div class="taskcard">

      <p class="muted" style="margin:2px 0 8px"><b>Targeting:</b> “${esc(targetStmt)}”</p>
      ${scaffold}
      <div class="qtext">${it.q}</div>
      <div class="opts" id="opts"></div>
      <div class="feedback" id="fb"></div>
      <div id="stretchslot"></div>
      <div class="nextrow noprint"><span></span><button class="btn btn-primary" id="tnext" style="display:none">Continue →</button></div>
    </div>`;
  const optsEl=mount.querySelector("#opts");
  let answered=false;
  shuffle(it.opts.slice()).forEach(o=>{
    const btn=document.createElement("button"); btn.className="opt"; btn.textContent=o;
    btn.onclick=()=>{
      if(answered) return; answered=true;
      const correct=(o===it.a);
      btn.classList.add(correct?"right":"wrongpick");
      if(!correct) optsEl.querySelectorAll(".opt").forEach(x=>{ if(x.textContent===it.a) x.classList.add("right"); });
      optsEl.querySelectorAll(".opt").forEach(x=>x.disabled=true);
      const fb=mount.querySelector("#fb");
      fb.className="feedback "+(correct?"ok":"bad");
      fb.innerHTML=(correct?"<b>Yes.</b> ":`<b>Not quite.</b> `)+it.explain;
      /* adapt the level */
      S.history[strand].push({served:servedLevel, correct});
      S.levels[strand]=clamp(S.levels[strand]+(correct?1:-1),5,11);
      const moved = correct
        ? `<div class="levelflag ${bandOf(clamp(S.levels[strand],6,11))}" style="margin-top:10px"><span class="lf-i">▲</span><span>Nice — stepping you up. Next ${esc(cont.name.toLowerCase())} task will aim higher.</span></div>`
        : `<div class="levelflag support" style="margin-top:10px"><span class="lf-i">⛺</span><span>No worries — the next ${esc(cont.name.toLowerCase())} task will build up from a simpler step, with support.</span></div>`;
      fb.innerHTML+=moved;
      /* stretch: free-response justification in the extend band */
      if(band==="extend" && it.stretch){
        document.getElementById("stretchslot").innerHTML=
          `<div class="stretchbox"><b>Extend:</b> ${it.stretch}
            <textarea class="writeframe" id="stretchtext" placeholder="Write your justification…"></textarea></div>`;
      }
      const nb=mount.querySelector("#tnext"); nb.style.display="inline-block";
      nb.onclick=()=>{
        const t=document.getElementById("stretchtext");
        if(t && t.value.trim()){ (S.writes[strand]=S.writes[strand]||[]).push({level:servedLevel, text:t.value.trim()}); }
        runSeasonTasks(ti+1);
      };
      nb.focus();
    };
    optsEl.appendChild(btn);
  });
}

/* ================= CONSEQUENCE SCREEN ================= */
function moodOf(v){ return v>=66?"happy":(v>=40?"ok":"unhappy"); }
function showConsequence(){
  const se=SEASONS[S.seasonIdx];
  curLayer="health";
  const mount=document.getElementById("season-body");
  const meterHtml=BUCKETS.map(b=>{
    const v=S.meters[b.key], d=S.lastDelta[b.key]||0;
    return `<div class="meter ${b.cls}"><div class="m-top"><span>${esc(b.meter)}</span><span>${v}/100</span></div>
      <div class="m-track"><div class="m-fill" style="width:${v}%"></div></div>
      <div class="m-delta ${d>=0?'up':'down'}">${d>=0?'▲ +':'▼ '}${d} this season</div></div>`;
  }).join("");
  const stakeHtml=STAKES.map(s=>{
    const v=S.meters[s.link], mood=moodOf(v);
    const line=s[mood];
    return `<div class="stake"><div class="st-top"><span class="st-name">${esc(s.name)}</span>
      <span class="st-mood" style="background:${moodColor(v)}">${mood}</span></div>
      <div class="st-role">${esc(s.role)}</div>
      <div class="st-bar"><span style="width:${v}%;background:${moodColor(v)}"></span></div>
      <div class="st-line">${esc(line)}</div></div>`;
  }).join("");
  const dry = S.waterholeDry ? `<div class="levelflag support" style="margin-top:8px"><span class="lf-i">⚠</span><span>The sacred <b>waterhole (billabong) has dried</b> at least once — a hard loss to reverse. Cultural &amp; spiritual value takes a heavy hit.</span></div>` : "";
  const last = S.seasonIdx>=SEASONS.length-1;
  mount.innerHTML=`
    <div class="seasonhead"><div><div class="s-name">${esc(se.name)} · what happened</div>
      <div class="s-sub">Your allocation, played out</div></div></div>
    <div class="mapwrap" id="mapwrap">${drawMap()}</div>
    <div class="mapcap">${LAYER_CAP.health}</div>
    <h3>The four values now</h3>
    <div class="meters">${meterHtml}</div>
    ${dry}
    <h3>Around the table</h3>
    <div class="stakes">${stakeHtml}</div>
    <div class="brief" style="border-left-color:var(--earth)"><b>Next:</b> ${se.event}</div>
    <div class="nextrow noprint"><span></span>
      <button class="btn btn-primary" onclick="${last?"endGame()":"renderSeason("+(S.seasonIdx+1)+")"}">${last?"Finish the year →":"On to "+SEASONS[S.seasonIdx+1].name+" →"}</button></div>`;
}

/* ================= SELF-ASSESSMENT (against the school ladder) ================= */
function endGame(){ S.finished=true; renderSelfAssess(); }
function renderSelfAssess(){
  go("selfassess");
  const mount=document.getElementById("selfassess-body");
  let strandsHtml="";
  Object.keys(CONTINUUM).forEach(strand=>{
    const c=CONTINUUM[strand];
    const rungs=Object.keys(c.rungs).map(Number).sort((a,b)=>a-b);
    const ladder=rungs.map(lv=>`
      <button class="rung" data-strand="${strand}" data-lv="${lv}" onclick="pickRung('${strand}',${lv})">
        <span class="r-lvl">Lvl ${lv}</span>
        <span class="r-txt">${esc(c.rungs[lv])}<span class="r-tags" id="tags-${strand}-${lv}"></span></span>
      </button>`).join("");
    strandsHtml+=`<div class="taskcard"><h3 style="margin-top:0">${esc(c.name)} <span class="strandtag">${esc(c.code)}</span></h3>
      <p class="muted">Which statement best matches what <b>you</b> did today? Tap it.</p>
      <div class="ladder" id="ladder-${strand}">${ladder}</div></div>`;
  });
  mount.innerHTML=`<h2 style="text-align:center">How did you go?</h2>
    <p class="subtitle">Rate yourself on the same continuum your teacher uses. Then reveal the level your play actually showed.</p>
    ${strandsHtml}
    <div class="nextrow noprint" style="justify-content:center">
      <button class="btn btn-ghost" id="revealbtn" onclick="revealEvidence()">Reveal my evidence &amp; compare</button>
      <button class="btn btn-primary" id="toreport" style="display:none" onclick="go('report')">See my report →</button></div>`;
}
function pickRung(strand,lv){
  S.self[strand]=lv;
  document.querySelectorAll(`#ladder-${strand} .rung`).forEach(r=>r.classList.toggle("picked", +r.dataset.lv===lv));
  refreshRungTags(strand);
}
function evidencedLevel(strand){
  const h=S.history[strand]; if(!h||!h.length) return clamp(S.levels[strand],6,11);
  const cleared=h.filter(x=>x.correct).map(x=>x.served);
  return clamp(cleared.length?Math.max.apply(null,cleared):Math.min.apply(null,h.map(x=>x.served)), 6,11);
}
let revealed=false;
function refreshRungTags(strand){
  const mine=S.self[strand], ev=revealed?evidencedLevel(strand):null;
  Object.keys(CONTINUUM[strand].rungs).forEach(lv=>{
    lv=+lv; const el=document.getElementById(`tags-${strand}-${lv}`); if(!el) return;
    let t=[];
    if(mine===lv) t.push(`<span class="r-mine">◀ your pick</span>`);
    if(ev===lv) t.push(`<span class="r-app">● shown by your play</span>`);
    el.innerHTML=t.length? " &nbsp;"+t.join(" &nbsp;"):"";
    const rung=document.querySelector(`#ladder-${strand} .rung[data-lv="${lv}"]`);
    if(rung) rung.classList.toggle("evid", ev===lv);
  });
}
function revealEvidence(){
  if(Object.keys(S.self).length<3){ alert("Pick a statement for all three strands first."); return; }
  revealed=true;
  Object.keys(CONTINUUM).forEach(refreshRungTags);
  document.getElementById("revealbtn").disabled=true;
  document.getElementById("toreport").style.display="inline-block";
}

/* ================= REPORT ================= */
function vcode(str){ let h=5381; for(let i=0;i<str.length;i++){ h=((h<<5)+h+str.charCodeAt(i))>>>0; } return h.toString(36).toUpperCase().padStart(7,"0").slice(0,7); }
function renderReport(){
  const m=document.getElementById("report-body");
  const name=S.name||"", sid=S.sid||"";
  const dt=new Date().toLocaleString("en-AU",{dateStyle:"full",timeStyle:"short"});
  const overallRaw=Math.round(BUCKETS.reduce((t,b)=>t+S.meters[b.key],0)/4);
  const lowest=Math.min.apply(null,BUCKETS.map(b=>S.meters[b.key]));
  const balancePenalty = lowest<35 ? 10 : (lowest<45?4:0);
  const overall=clamp(overallRaw-balancePenalty,0,100);
  const cls=overall>=70?"good":(overall>=50?"mid":"low");
  const meterRows=BUCKETS.map(b=>`<tr><td>${esc(b.meter)}</td><td class="lvl">${S.meters[b.key]}/100</td>
    <td>${S.meters[b.key]>=66?"looked after":(S.meters[b.key]>=40?"under strain":"sacrificed")}</td></tr>`).join("");
  let contRows="";
  Object.keys(CONTINUUM).forEach(strand=>{
    const c=CONTINUUM[strand]; const ev=clamp(evidencedLevel(strand),6,11); const mine=S.self[strand];
    const band=bandOf(ev);
    contRows+=`<tr><td><b>${esc(c.name)}</b><br><span class="muted">${esc(c.code)}</span></td>
      <td class="lvl"><span class="bandtag ${band}">${BAND_ICON[band]} Lvl ${ev}</span><br><span class="muted">${bandLabel(ev)}</span></td>
      <td>“${esc(c.rungs[ev])}”${mine&&mine!==ev?`<br><span class="muted">Self-rated Level ${mine} — ${mine>ev?"aim to show it next time":"you sold yourself short"}.</span>`:(mine?`<br><span class="muted">Matches your self-rating. ✓</span>`:"")}</td></tr>`;
  });
  let writeHtml="";
  Object.keys(S.writes||{}).forEach(strand=>{
    (S.writes[strand]||[]).forEach(w=>{ writeHtml+=`<p class="muted"><b>${esc(CONTINUUM[strand].name)} (extend):</b> “${esc(w.text)}”</p>`; });
  });
  const code=vcode(`${name}|${sid}|${overall}|${BUCKETS.map(b=>S.meters[b.key]).join(",")}|${Object.keys(CONTINUUM).map(s=>evidencedLevel(s)).join(",")}`);
  m.innerHTML=`
    <div class="idrow noprint">
      <span><label>Your name</label><input id="rep-name" value="${esc(name)}" placeholder="e.g. Ama Osei"></span>
      <span><label>Student ID</label><input id="rep-sid" value="${esc(sid)}" placeholder="e.g. KHS12345"></span>
      <span><button class="btn btn-primary" onclick="saveIdAndPrint()">Save as PDF</button></span>
    </div>
    <p class="muted noprint" style="margin-bottom:12px">Enter your name &amp; ID, click <b>Save as PDF</b>, choose “Save as PDF” in the print box, then send it to your teacher.</p>
    <h2>Share the River — Report</h2>
    <p class="muted">${name?`<b>${esc(name)}</b>`:"<i>(name not entered)</i>"} · ID ${sid?`<b>${esc(sid)}</b>`:"<i>(not entered)</i>"} · ${dt}</p>
    <div class="sumbox"><div class="progress">HOW WELL YOU SHARED THE RIVER</div>
      <div class="big ${cls}">${overall}/100</div>
      <p class="muted">${lowest<35?"You kept the system running by sacrificing one value — a real choice with real costs.":(lowest<50?"A workable balance, though one value ran close to the edge.":"A genuinely balanced year — rare, and hard-won.")}</p></div>
    <h3>The four values at year's end</h3>
    <table class="repgrid"><tr><th>Value</th><th>Final</th><th>Verdict</th></tr>${meterRows}</table>
    <h3>Your Geography continuum — shown by your play</h3>
    <div class="band-key"><span><i style="background:var(--supportbg);border:1px solid var(--support)"></i>⛺ Years 5–6</span>
      <span><i style="background:var(--corebg);border:1px solid var(--core)"></i>⚑ Years 7–8</span>
      <span><i style="background:var(--extendbg);border:1px solid var(--extend)"></i>⛰ Years 9–10</span></div>
    <table class="repgrid"><tr><th>Strand</th><th>Level shown</th><th>“I can…” &amp; self-assessment</th></tr>${contRows}</table>
    ${writeHtml?`<h3>Your written justifications</h3>${writeHtml}`:""}
    <h3>What this means</h3>
    <p class="muted">The core simulation sits at Years 7–8. Where your thinking tasks showed Year 5–6, you were given extra support to build up; where they showed Years 9–10, the tasks stepped up to evaluation, scale and time. “Level shown” is the highest rung your answers actually cleared — bring the written justification and this report to class to talk it through with your teacher.</p>
    <p class="muted">Verification code: <span class="vcode">${code}</span> · Share the River</p>`;
}
function saveIdAndPrint(){
  S.name=document.getElementById("rep-name").value.trim();
  S.sid=document.getElementById("rep-sid").value.trim();
  renderReport();
  setTimeout(()=>window.print(),150);
}

/* ---- boot ---- */
renderIntro();
</script>
