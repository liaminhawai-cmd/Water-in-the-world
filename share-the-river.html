<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Share the River — Water in the World</title>
<style>
  :root{
    --bg:#f2ece0; --paper:#fbf7ef; --ink:#211d17; --muted:#6c6353;
    --line:#d9cfb9; --line-soft:#e8e0ce;
    --water:#2c7488; --water-d:#215866;
    --earth:#b0741f; --earth-d:#8f5d16;
    --good:#2f6a3e; --warn:#9a6b1f; --bad:#a8432f;
    --okbg:#eef4ec; --badbg:#f6ece8; --warnbg:#f6efda;
    --farm:#b0741f; --farmbg:#f4ead7;
    --town:#7a4a6f; --townbg:#f1e6ee;
    --river:#2c7488; --riverbg:#e6f0f1;
    --culture:#3f7a4a; --culturebg:#e6f1e8;
    --money:#8f7a2c;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:var(--bg);
       min-height:100vh;padding:14px;display:flex;justify-content:center;align-items:flex-start;color:var(--ink)}
  .container{background:var(--paper);border:1px solid var(--line);border-radius:12px;
       max-width:1060px;width:100%;padding:20px;margin-top:10px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
  h1{text-align:center;font-size:24px;font-family:Georgia,'Times New Roman',serif;letter-spacing:.3px}
  h2{font-family:Georgia,serif;font-size:18px;margin:2px 0 8px}
  h3{font-family:Georgia,serif;font-size:14.5px;margin:14px 0 7px}
  .subtitle{color:var(--muted);text-align:center;margin:6px 0 12px;font-size:13px}
  .muted{color:var(--muted);font-size:12.5px;line-height:1.6}
  .screen{display:none}.screen.active{display:block}
  button{font-family:inherit}
  .btn{padding:11px 18px;border:1px solid var(--line);border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;background:var(--paper);color:var(--ink);transition:all .15s ease}
  .btn-primary{background:var(--water);color:#fff;border-color:var(--water)}
  .btn-primary:hover:not(:disabled){background:var(--water-d)}
  .btn-primary:disabled{background:var(--line);border-color:var(--line);color:var(--muted);cursor:not-allowed}
  .btn-ghost{background:var(--bg);color:var(--muted)}
  .btn-ghost:hover{color:var(--ink);border-color:var(--ink)}
  .linkbtn{background:none;border:none;color:var(--water-d);font-weight:600;font-size:13px;cursor:pointer;padding:4px 8px}
  .linkbtn:hover{text-decoration:underline}
  button:focus-visible,[tabindex]:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--water);outline-offset:2px}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}

  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .progress{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.4px}
  .brief{background:var(--bg);border:1px solid var(--line-soft);border-left:4px solid var(--water);border-radius:8px;padding:12px 15px;margin:10px 0;font-size:13.5px;line-height:1.6}
  .brief b{color:var(--water-d)}
  .note{font-size:11.5px;color:var(--muted);font-style:italic;line-height:1.55}

  /* ---- top gauges row ---- */
  .gaugerow{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch;margin:8px 0}
  .gauge{flex:1 1 150px;border:1px solid var(--line-soft);border-radius:9px;padding:9px 12px;background:var(--paper)}
  .gauge .g-lab{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--muted)}
  .gauge .g-val{font-family:Georgia,serif;font-size:20px;font-weight:700}
  .gauge .g-val.money{color:var(--money)} .gauge .g-val.store{color:var(--water-d)}
  .gauge .g-sub{font-size:11px;color:var(--muted)}
  .resbar{height:8px;background:var(--line-soft);border-radius:99px;overflow:hidden;margin-top:5px}
  .resbar span{display:block;height:100%;background:var(--water);border-radius:99px;transition:width .3s}
  /* forecast mini chart */
  .forecast{flex:1 1 200px;border:1px solid var(--line-soft);border-radius:9px;padding:9px 12px;background:var(--paper)}
  .fc-bars{display:flex;gap:8px;align-items:flex-end;height:44px;margin-top:4px}
  .fc-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;justify-content:flex-end;height:100%}
  .fc-col .fc-bar{width:70%;background:var(--water);border-radius:3px 3px 0 0;min-height:3px}
  .fc-col.now .fc-bar{background:var(--earth)}
  .fc-col .fc-lab{font-size:9px;color:var(--muted)}

  /* ---- map + layers ---- */
  .maparea{display:grid;grid-template-columns:1.15fr 1fr;gap:14px;align-items:start;margin-top:6px}
  @media(max-width:820px){.maparea{grid-template-columns:1fr}}
  .layerbtns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:7px}
  .lbtn{cursor:pointer;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--bg);border-radius:16px;padding:6px 12px;color:var(--muted)}
  .lbtn.on{background:var(--paper);border-color:var(--water);color:var(--water-d)}
  .lbtn .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
  .mapframe{border:1px solid var(--line-soft);border-radius:10px;background:#e7eff0;padding:6px}
  .mapframe svg{width:100%;height:auto;display:block;touch-action:manipulation}
  .node-hit{cursor:pointer}
  .mapcap{font-size:12px;color:var(--muted);background:var(--bg);border-radius:6px;padding:8px 11px;line-height:1.55;min-height:40px;margin-top:7px}
  .accounting{border:1px solid var(--line-soft);border-radius:8px;padding:9px 11px;background:var(--bg);font-size:12px;margin-top:7px}
  .accounting .arow{display:flex;justify-content:space-between;padding:2px 0}
  .accounting .arow b{font-family:Georgia,serif}
  .accounting .arow.warn b{color:var(--bad)}

  /* ---- decision cards (right column) ---- */
  .decks{display:flex;flex-direction:column;gap:9px}
  .deck{border:1px solid var(--line-soft);border-radius:10px;padding:11px 13px;background:var(--paper);border-left:5px solid var(--line)}
  .deck.sel{box-shadow:0 0 0 2px var(--water)}
  .deck.farm{border-left-color:var(--farm)} .deck.town{border-left-color:var(--town)}
  .deck.river{border-left-color:var(--river)} .deck.culture{border-left-color:var(--culture)} .deck.store{border-left-color:var(--water)}
  .deck-top{display:flex;align-items:center;gap:8px}
  .deck-name{font-weight:700;font-size:14px}
  .deck-tag{margin-left:auto;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
  .deck-desc{font-size:11.5px;color:var(--muted);line-height:1.5;margin:5px 0 7px}
  .row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:5px 0}
  .stepper{display:flex;align-items:center;gap:8px}
  .stepper button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:18px;font-weight:800;cursor:pointer;color:var(--ink)}
  .stepper button:hover:not(:disabled){border-color:var(--water)}
  .stepper button:disabled{opacity:.35;cursor:not-allowed}
  .stepper .val{font-family:Georgia,serif;font-size:18px;font-weight:700;min-width:52px;text-align:center}
  .rlab{font-size:11.5px;color:var(--muted);min-width:64px}
  .toggle{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .toggle button{border:none;background:var(--bg);padding:7px 11px;font-size:12px;font-weight:600;cursor:pointer;color:var(--muted)}
  .toggle button.on{background:var(--water);color:#fff}
  .toggle button:not(:last-child){border-right:1px solid var(--line)}
  .pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:12px;background:var(--bg);color:var(--muted);cursor:pointer;border:1px solid var(--line)}
  .pill.on{background:var(--water);color:#fff;border-color:var(--water)}
  .pill.owned{background:var(--okbg);color:var(--good);border-color:var(--good);cursor:default}
  .cost{font-size:11px;color:var(--money);font-weight:700}

  /* ---- advisers ---- */
  .advisers{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
  @media(max-width:680px){.advisers{grid-template-columns:1fr}}
  .adv{border:1px solid var(--line-soft);border-top:4px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--paper)}
  .adv.farm{border-top-color:var(--farm)} .adv.town{border-top-color:var(--town)}
  .adv.river{border-top-color:var(--river)} .adv.culture{border-top-color:var(--culture)} .adv.hydro{border-top-color:var(--muted)}
  .adv-top{display:flex;align-items:center;gap:8px}
  .adv-face{width:32px;height:32px;flex:0 0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;background:var(--bg);border:1px solid var(--line)}
  .adv-name{font-weight:700;font-size:13px} .adv-role{font-size:11px;color:var(--muted)}
  .adv-mood{margin-left:auto;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;padding:2px 8px;border-radius:11px;color:#fff}
  .adv-bar{height:6px;background:var(--line-soft);border-radius:99px;overflow:hidden;margin:6px 0 0}
  .adv-bar span{display:block;height:100%;border-radius:99px;transition:width .5s}
  .adv-say{font-size:12px;line-height:1.5;margin-top:6px}
  .adv-consult{margin-top:6px}
  .adv-full{display:none;margin-top:6px;border-top:1px dashed var(--line-soft);padding-top:6px}
  .adv-full.open{display:block}
  .adv-full p{font-size:12px;line-height:1.55;margin-bottom:5px}
  .adv-wants{font-size:11.5px;color:var(--muted)} .adv-wants b{color:var(--ink)}

  /* ---- run row + consequence ---- */
  .runrow{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}
  .logentry{border:1px solid var(--line-soft);border-radius:10px;padding:13px 15px;margin:10px 0;background:var(--paper)}
  .le-head{font-family:Georgia,serif;font-weight:700;font-size:15px;margin-bottom:6px}
  .le-narr{font-size:13px;line-height:1.6;margin-bottom:8px}
  .le-narr b{color:var(--water-d)}
  .meters{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:8px 0}
  @media(max-width:680px){.meters{grid-template-columns:1fr}}
  .meter{border:1px solid var(--line-soft);border-radius:8px;padding:7px 10px;background:var(--bg)}
  .meter .m-top{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700}
  .meter .m-track{height:8px;background:var(--line-soft);border-radius:99px;overflow:hidden;margin:5px 0 2px}
  .meter .m-fill{height:100%;border-radius:99px;transition:width .6s}
  .meter.farm .m-fill{background:var(--farm)} .meter.town .m-fill{background:var(--town)}
  .meter.river .m-fill{background:var(--river)} .meter.culture .m-fill{background:var(--culture)}
  .meter .m-delta{font-size:10px;font-weight:700}
  .m-delta.up{color:var(--good)} .m-delta.down{color:var(--bad)} .m-delta.flat{color:var(--muted)}
  .alert{border-radius:8px;padding:9px 12px;margin:7px 0;font-size:12.5px;line-height:1.5}
  .alert.bad{background:var(--badbg);border:1px solid var(--bad)}
  .alert.good{background:var(--okbg);border:1px solid var(--good)}
  .react{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
  @media(max-width:680px){.react{grid-template-columns:1fr}}
  .rcard{border:1px solid var(--line-soft);border-left:3px solid;border-radius:7px;padding:8px 10px;font-size:11.5px;line-height:1.45}
  .rcard.farm{border-left-color:var(--farm)} .rcard.town{border-left-color:var(--town)}
  .rcard.river{border-left-color:var(--river)} .rcard.culture{border-left-color:var(--culture)}
  .rcard .rc-name{font-weight:700}

  /* ---- verdict + debrief (shared with report) ---- */
  .verdict{border-radius:10px;padding:15px;margin:12px 0;border:1px solid}
  .verdict.good{background:var(--okbg);border-color:var(--good)}
  .verdict.mixed{background:var(--warnbg);border-color:var(--warn)}
  .verdict.bad{background:var(--badbg);border-color:var(--bad)}
  .verdict h3{margin:0 0 6px;font-size:18px}.verdict p{font-size:13.5px;line-height:1.6}
  details.reflect{border:1px solid var(--line);border-radius:10px;margin:12px 0;background:var(--paper)}
  details.reflect>summary{cursor:pointer;font-family:Georgia,serif;font-weight:700;font-size:16px;padding:13px 16px;list-style:none}
  details.reflect>summary::-webkit-details-marker{display:none}
  details.reflect>summary::before{content:"▸ ";color:var(--water)} details.reflect[open]>summary::before{content:"▾ "}
  .reflect-body{padding:0 16px 14px}
  .saq{border-top:1px solid var(--line-soft);padding:12px 0}
  .saq .tie{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
  .saq .q{font-size:14px;line-height:1.55;margin:5px 0 4px}
  .saq textarea{width:100%;font-family:inherit;font-size:14px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);resize:vertical;min-height:62px}
  .saq-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .chip{font-size:11.5px;font-weight:600;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:5px 11px;cursor:pointer;color:var(--muted)}
  .chip:hover{border-color:var(--water);color:var(--water-d)}
  .scaffold,.stretchq{border-radius:8px;padding:9px 12px;margin-top:6px;font-size:12.5px;line-height:1.55;display:none}
  .scaffold{background:var(--warnbg);border:1px solid #e2c79a} .stretchq{background:var(--riverbg);border:1px solid #b9d2da}
  .scaffold.show,.stretchq.show{display:block}
  .sc{font-size:12.5px;line-height:1.55;margin-top:7px;padding:9px 12px;border-radius:8px;background:var(--bg);display:none}
  .sc.show{display:block}.sc .ok{color:var(--good);font-weight:700}.sc .miss{color:var(--warn)}
  .ladder{display:flex;flex-direction:column;gap:5px;margin:8px 0}
  .rung{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line-soft);border-radius:8px;padding:9px 11px;background:var(--paper);cursor:pointer;text-align:left;width:100%}
  .rung:hover{border-color:var(--water)}.rung.picked{border-color:var(--water);background:var(--riverbg)}
  .rung .r-lvl{font-family:Georgia,serif;font-weight:800;font-size:12px;color:var(--muted);flex-shrink:0;width:52px}
  .rung .r-txt{font-size:12.5px;line-height:1.4}.yearband{font-size:10px;font-weight:800;color:var(--muted);margin-left:4px}
  .repgrid{width:100%;border-collapse:collapse;margin:8px 0}
  .repgrid th,.repgrid td{border:1px solid var(--line);padding:6px 8px;font-size:12px;text-align:left;vertical-align:top}
  .repgrid th{background:var(--bg);font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted)}
  .idrow{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0;align-items:flex-end}
  .idrow label{font-size:12px;font-weight:700;color:var(--muted);display:block;margin-bottom:4px}
  .idrow input{padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:15px;font-family:inherit;background:#fff}
  .vcode{font-family:'Courier New',monospace;font-size:13px;letter-spacing:2px}
  @media print{ body{background:#fff;padding:0} .container{border:none;box-shadow:none;max-width:100%;padding:6px} .noprint{display:none !important} }
</style>
</head>
<body>
<div class="container">
<div class="screen active" id="scr-game"></div>
<div class="screen" id="scr-report">
  <div class="topbar noprint"><button class="linkbtn" onclick="location.reload()">&larr; play again</button><span class="progress">PLAN &amp; REPORT</span></div>
  <div id="report-body"></div>
</div>
</div>
<script>
"use strict";
/* ============================================================
   SHARE THE RIVER — a spatial catchment simulation
   (Year 7 "Water in the World"), built in the mould of the
   Coasts / Deserts / Mountains sims: the MAP is the decision
   surface, DATA LAYERS you toggle must be read to plan well,
   many combinable choices give a large decision space, and
   consequences emerge from a transparent systems model and are
   irreversible. Knowledge lives in the advisers' voices;
   judgement is withheld until you run the season; assessment is
   an opt-in, non-grading debrief against the school continuum.
   A fictionalised catchment standing in for the Murray–Darling
   Basin — a deliberate simplification, named as such.
   ============================================================ */
/* ============================================================
   THE CATCHMENT — places on the map (vertical, upstream→down).
   viewBox 0 0 460 640. Each place is a node the map draws and
   (for the users) a decision "deck" on the right.
   ============================================================ */
const PLACES = [
  { key:"res",     x:230, y:70,  icon:"🏔", label:"Highland dam",        kind:"store" },
  { key:"cotton",  x:120, y:180, icon:"🌾", label:"Cotton district",     kind:"farm" },
  { key:"trib",    x:360, y:250, icon:"🔀", label:"Tributary",           kind:"info" },
  { key:"orchard", x:120, y:320, icon:"🍊", label:"Orchard district",    kind:"farm" },
  { key:"town",    x:230, y:410, icon:"🏘", label:"Willow Bend",         kind:"town" },
  { key:"wetland", x:230, y:500, icon:"🦢", label:"Ramsar wetland",      kind:"river" },
  { key:"hole",    x:345, y:585, icon:"💧", label:"Waterhole (billabong)", kind:"culture" },
];

/* the four water USERS you actively decide for (the decision decks) */
const DISTRICTS = {
  cotton:  { key:"cotton",  cls:"farm", name:"Cotton district", tag:"upstream", earn:7,
    needFlood:8, needDrip:5, dripCost:3,
    desc:"The district's biggest earner — and the thirstiest. It takes water before anyone downstream sees it. Flood irrigation is cheap but wastes water; drip costs money to install but grows the same crop on far less." },
  orchard: { key:"orchard", cls:"farm", name:"Orchard district", tag:"midstream", earn:4,
    needFlood:5, needDrip:3, dripCost:2,
    desc:"Citrus, below the tributary. Smaller than cotton, but its fruit earns well. Same choice: flood or efficient drip." },
};
const TOWN = { key:"town", cls:"town", name:"Willow Bend", baseNeed:5, jobsShare:0.35, recycleCost:4, recycleCut:2, restrictCut:1, restrictCost:[0,0.5,1], restrictPenalty:[0,6,14] };
const RES  = { key:"res", cls:"store", name:"Highland dam", cap:8, start:3 };

/* the model that turns choices into the four values */
const MODEL = {
  startMeters:{ farm:55, town:58, river:60, culture:60 },
  startBudget:8,
  wetlandNeed:6, waterholeMin:1, waterholeNeed:3,
  spillFrac:0.5,            // fraction of environmental flow that continues past the wetland to the hole
  overTakeThreshold:0.85,   // taking >85% of available water stresses the river
  overTakePenalty:16,
  riverInertiaUp:0.30, riverInertiaDown:0.65,
  townRiverFailPenalty:16, driedCultureCap:30, cultureRiverBonus:8,
};

/* ---- seasons: inflow at the dam + the tributary's add ---- */
const SEASONS = [
  { name:"Summer", sub:"the dry sets in", inflow:12, trib:2,
    setUp:"A hot, dry summer opens the year. Read the map layers before you decide who gets what.",
    event:"The Bureau says an <b>El Niño</b> is likely — a hotter, drier year ahead. The next two seasons look worse." },
  { name:"Autumn", sub:"El Niño confirmed", inflow:9, trib:2,
    setUp:"El Niño is confirmed and inflow has dropped.",
    event:"A heatwave lifts the town's demand and dries the soil further. Winter will be the hardest season." },
  { name:"Winter", sub:"deep drought", inflow:6, trib:1,
    setUp:"The driest winter on record for the reach. If you banked water in the dam, this is when it earns its keep.",
    event:"Upstream, an irrigator is caught taking more than their licence — 'water theft' makes the news." },
  { name:"Spring", sub:"a wet pulse", inflow:13, trib:4,
    setUp:"Rain in the northern catchment sends a pulse down the tributary — a chance to refill the dam or let the river recover.",
    event:"La Niña signs appear. The drought may be breaking." },
];

/* ---- data layers (the reason to READ the map) ---- */
const LAYERS = {
  water:{ label:"Water", dot:"#2c7488",
    cap:"The river flows from the dam down past the farms, the town and the wetland to the sacred waterhole. The tributary adds water midway. Whatever you take up top never reaches the users below." },
  rain:{ label:"Rainfall & inflow", dot:"#8aab6a",
    cap:"Rain falls mostly on the wet upstream ranges and fades downstream. Most water enters at the dam; the tributary adds a second, separate source part-way down — worth watching in the wet-pulse season." },
  demand:{ label:"Who wants it", dot:"#b0741f",
    cap:"Each user's demand is shown as a bubble — bigger means thirstier. Cotton wants the most, and it sits at the top of the system." },
  health:{ label:"River health", dot:"#a8432f",
    cap:"The river's colour shows its health along its length: green is healthy, red is slow, warm and salty. Watch where the stress builds — it's always downstream of where you took the water." },
};

/* ============================================================
   ADVISERS — the knowledge is in their voices.
   ============================================================ */
const HYDRO = { key:"hydro", cls:"hydro", name:"Sana O.", role:"Catchment hydrologist", icon:"📈",
  profile:[
    "My job is to explain how this catchment works, not to take a side.",
    "Water is <b>renewable</b> — the cycle keeps re-supplying it — but the amount arriving each season is <b>finite</b>, and in drought it shrinks. Read the <b>inflow</b> layer and the season forecast: most water enters at the dam, and the <b>tributary</b> adds a second source part-way down.",
    "Two levers change everything. The <b>dam</b> lets you move water through <b>time</b> — bank it in a wet season, release it in a dry one. And <b>efficient (drip) irrigation</b> grows the same crop on less water, leaving more in the river — for a price. Everything here is downstream of everything else."],
};
const ADVISERS = [

/* ================= STATE + HELPERS ================= */
const state = {
  seasonIdx:0,
  meters:{...MODEL.startMeters}, budget:MODEL.startBudget, store:RES.start, dried:false,
  owned:{cottonDrip:false, orchardDrip:false, recycle:false},
  dec:null, layer:"water",
  log:[], consult:{}, reflections:{}, self:{}, name:"", sid:"",
};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const round1=v=>Math.round(v*10)/10;
const blend=(a,b,t)=>a*(1-t)+b*t;
function esc(t){ const d=document.createElement("div"); d.textContent=t; return d.innerHTML; }
function go(id){ document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active")); document.getElementById("scr-"+id).classList.add("active"); window.scrollTo(0,0); if(id==="report") renderReport(); }
function moodOf(v){ return v>=60?"good":(v>=40?"concern":"bad"); }
function moodWord(v){ return v>=60?"content":(v>=40?"uneasy":"unhappy"); }
function moodColor(v){ return v>=60?"#2f6a3e":(v>=40?"#9a6b1f":"#a8432f"); }
function need(k){ return DISTRICTS[k][state.owned[k+"Drip"]?"needDrip":"needFlood"]; }
function benefit(k){ return Math.min(1, state.dec[k]/need(k)); }
function townDemand(restrict){ return Math.max(1, TOWN.baseNeed - (state.owned.recycle?TOWN.recycleCut:0) - TOWN.restrictCut*(restrict!=null?restrict:state.dec.restrict)); }
function available(){ const se=SEASONS[state.seasonIdx]; return se.inflow+se.trib+state.dec.release; }
function usedWater(){ const d=state.dec; return d.cotton+d.orchard+d.townSupply+d.culture+d.store; }
function remaining(){ return available()-usedWater(); }
function envFlow(){ return Math.max(0, remaining()); }
function toHole(){ return state.dec.culture; } /* the billabong is a cut-off bend — only the water you send it */
function freshDec(){ const d={ release:0, store:0, cotton:0, orchard:0, townSupply:0, culture:0, restrict:0 }; state.dec=d; d.townSupply=townDemand(0); return d; }

/* ================= THE MODEL ================= */
function runModel(){
  const d=state.dec, av=available(), used=usedWater(), env=envFlow(), hole=toHole();
  const overTake = used/Math.max(1,av) > MODEL.overTakeThreshold;
  // farm
  const cB=benefit("cotton"), oB=benefit("orchard");
  const income = Math.round(DISTRICTS.cotton.earn*cB + DISTRICTS.orchard.earn*oB);
  const farmTarget = clamp(100*((DISTRICTS.cotton.earn*cB+DISTRICTS.orchard.earn*oB)/(DISTRICTS.cotton.earn+DISTRICTS.orchard.earn)),0,100);
  const newFarm = Math.round(blend(state.meters.farm, farmTarget, 0.5));
  // river
  let riverTarget = 100*Math.min(1, env/MODEL.wetlandNeed);
  if(overTake) riverTarget -= MODEL.overTakePenalty;
  riverTarget = clamp(riverTarget,0,100);
  const inertia = riverTarget<state.meters.river?MODEL.riverInertiaDown:MODEL.riverInertiaUp;
  const newRiver = Math.round(blend(state.meters.river, riverTarget, inertia));
  // culture (irreversible dry)
  let driedNow=false;
  if(hole < MODEL.waterholeMin && !state.dried) driedNow=true;
  if(hole < MODEL.waterholeMin) state.dried=true;
  let cultureTarget = 100*Math.min(1, hole/MODEL.waterholeNeed);
  if(newRiver>=60) cultureTarget += MODEL.cultureRiverBonus;
  cultureTarget = clamp(cultureTarget,0,100);
  let newCulture = Math.round(blend(state.meters.culture, cultureTarget, 0.5));
  if(state.dried) newCulture = Math.min(newCulture, MODEL.driedCultureCap);
  // town
  const dem=townDemand(), townWater=100*Math.min(1, d.townSupply/dem);
  let townTarget=(1-TOWN.jobsShare)*townWater + TOWN.jobsShare*newFarm - TOWN.restrictPenalty[d.restrict];
  if(newRiver<35) townTarget -= MODEL.townRiverFailPenalty;
  townTarget = clamp(townTarget,0,100);
  const newTown = Math.round(blend(state.meters.town, townTarget, 0.5));
  const before={...state.meters};
  state.meters={farm:newFarm,town:newTown,river:newRiver,culture:newCulture};
  const deltas={}; for(const k in before) deltas[k]=state.meters[k]-before[k];
  // reservoir + budget settle
  state.store = clamp(state.store - d.release + d.store, 0, RES.cap);
  state.budget = round1(state.budget - TOWN.restrictCost[d.restrict] + income);
  return { season:state.seasonIdx, dec:{...d}, av, used, env, hole, overTake, income, driedNow, deltas, meters:{...state.meters}, cB, oB };
}

/* ================= MAP (multi-layer, live) ================= */
function segFlows(){
  const se=SEASONS[state.seasonIdx], d=state.dec;
  const leavingDam = se.inflow + d.release - d.store;
  const afterCotton = leavingDam - d.cotton;
  const afterTrib = afterCotton + se.trib;
  const afterOrchard = afterTrib - d.orchard;
  const afterTown = afterOrchard - d.townSupply;
  const atWetland = Math.max(0, afterTown - d.culture); /* culture diverted to the cut-off billabong */
  const toHoleF = d.culture;
  return { leavingDam, afterCotton, afterTrib, afterOrchard, afterTown, atWetland, toHoleF };
}
function healthCol(flow, ref){ const f=clamp(flow/ref,0,1); return f>=0.66?"#2c7488":(f>=0.33?"#c98a2b":"#a8432f"); }
function drawMap(){
  const L=state.layer, f=segFlows(), se=SEASONS[state.seasonIdx];
  const W=flow=>clamp(2+flow*1.5,2,17);
  const chanCol=(flow,ref)=> L==="health"?healthCol(flow,ref):"#2c7488";
  // main channel segments: [y1,y2,flow,ref]
  const segs=[[95,180,f.leavingDam,se.inflow],[180,250,f.afterCotton,se.inflow],[250,320,f.afterTrib,se.inflow],
    [320,410,f.afterOrchard,se.inflow],[410,500,f.atWetland,MODEL.wetlandNeed],[500,600,Math.max(0,f.atWetland-1),MODEL.wetlandNeed]];
  let river=segs.map(s=>`<line x1="230" y1="${s[0]}" x2="230" y2="${s[1]}" stroke="${chanCol(s[2],s[3])}" stroke-width="${W(s[2])}" stroke-linecap="round" opacity="${L==='rain'?0.4:0.95}"/>`).join("");
  // tributary joining from the right
  river+=`<line x1="430" y1="235" x2="232" y2="250" stroke="#2c7488" stroke-width="${W(se.trib)}" stroke-linecap="round" opacity="0.9"/>`;
  // cultural release: a side channel off to the cut-off billabong (only fed by what you send)
  river+=`<path d="M230 525 Q300 545 345 575" fill="none" stroke="${f.toHoleF>=MODEL.waterholeMin?'#3f7a4a':'#c98a2b'}" stroke-width="${W(f.toHoleF)}" stroke-linecap="round" stroke-dasharray="${f.toHoleF>0?'':'2 5'}" opacity="0.9"/>`;
  // rainfall gradient overlay
  let rain="";
  if(L==="rain"){ rain=`<defs><linearGradient id="rg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe3c9"/><stop offset="0.6" stop-color="#e8e0c4"/><stop offset="1" stop-color="#e6d3ad"/></linearGradient></defs>
    <rect x="0" y="0" width="460" height="640" fill="url(#rg)" opacity="0.6"/>
    <text x="18" y="46" font-size="11" fill="#3a6030" font-family="Georgia,serif">wet ranges</text>
    <text x="18" y="610" font-size="11" fill="#8a5a0c" font-family="Georgia,serif">dry lowland</text>
    <text x="342" y="222" font-size="10.5" fill="#3a6030" font-family="Georgia,serif">tributary +${se.trib} GL</text>`; }
  // reservoir gauge on the dam
  const resFrac=state.store/RES.cap;
  const resGauge=`<rect x="205" y="40" width="14" height="34" rx="3" fill="#fff" stroke="#215866" stroke-width="1.5"/>
    <rect x="205" y="${40+34*(1-resFrac)}" width="14" height="${34*resFrac}" fill="#2c7488"/>
    <text x="212" y="34" text-anchor="middle" font-size="9.5" fill="#215866" font-family="ui-sans-serif">${round1(state.store)}/${RES.cap}</text>`;
  // nodes
  const nodeAt={};PLACES.forEach(p=>nodeAt[p.key]=p);
  const userState={ cotton:benefit("cotton"), orchard:benefit("orchard"), town:Math.min(1,state.dec.townSupply/townDemand()) };
  let nodes=PLACES.map(p=>{
    let extra="";
    if(L==="demand"){ const dm={cotton:need("cotton"),orchard:need("orchard"),town:townDemand()}[p.key]; if(dm) extra=`<circle cx="${p.x}" cy="${p.y}" r="${8+dm*3}" fill="var(--${DISTRICTS[p.key]?'farm':(p.key==='town'?'town':'muted')})" opacity="0.18"/>`; }
    const litOpacity = (userState[p.key]!=null)?(0.5+0.5*userState[p.key]):1;
    let ic=p.icon;
    if(p.key==="hole"){ if(state.dried){ic="🪨";} }
    if(p.key==="wetland"){ ic = f.atWetland>=MODEL.wetlandNeed*0.6 ? "🦢":"🥀"; }
    const off = DISTRICTS[p.key] ? `<line x1="230" y1="${p.y}" x2="${p.x+18}" y2="${p.y}" stroke="var(--farm)" stroke-width="${W(state.dec[p.key])}" stroke-linecap="round" opacity="0.8"/>` : "";
    return `${extra}${off}<g class="node-hit" onclick="selectDeck('${p.key}')">
      <circle cx="${p.x}" cy="${p.y}" r="17" fill="#fbf7ef" stroke="#8a8577" stroke-width="1.5" opacity="${litOpacity}"/>
      <text x="${p.x}" y="${p.y+6}" text-anchor="middle" font-size="17" opacity="${litOpacity}">${ic}</text>
      <text x="${p.x}" y="${p.y+31}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#211d17" font-family="ui-sans-serif">${p.label}</text></g>`;
  }).join("");
  return `<svg viewBox="0 0 460 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Vertical catchment: dam at the top, users down to the sacred waterhole at the bottom">
    ${rain}<text x="230" y="18" text-anchor="middle" font-size="10.5" fill="#215866" font-family="Georgia,serif">▲ upstream</text>
    ${river}${resGauge}${nodes}
    <text x="230" y="632" text-anchor="middle" font-size="10.5" fill="#215866" font-family="Georgia,serif">downstream ▼</text></svg>`;
}

    <p class="muted" style="margin-bottom:6px">${se.setUp}</p>
    <div class="gaugerow">
      <div class="gauge"><div class="g-lab">Budget</div><div class="g-val money" id="g-budget">$${round1(state.budget)}M</div><div class="g-sub">farms earn it; efficiency &amp; measures cost it</div></div>
      <div class="gauge"><div class="g-lab">Dam storage</div><div class="g-val store" id="g-store">${round1(state.store)} / ${RES.cap} GL</div><div class="resbar"><span style="width:${100*state.store/RES.cap}%"></span></div></div>
      ${fcChart()}</div>
    <div id="advzone">${renderAdvisers()}</div>
    <div class="maparea">
      <div><div class="layerbtns" id="layerbtns"></div><div class="mapframe" id="mapframe">${drawMap()}</div><div class="mapcap" id="mapcap">${LAYERS[state.layer].cap}</div>
        <div class="accounting" id="accounting">${accountingHtml()}</div></div>
      <div><h3 style="margin-top:0">Your plan for ${esc(se.name)}</h3><div class="decks" id="decks"></div>
        <div class="runrow"><span class="muted" id="planhint"></span><button class="btn btn-primary" id="runbtn" onclick="runSeason()">Run ${esc(se.name)} →</button></div></div>
    </div>`;
  wireLayers(); renderDecks();
}
function deckStepper(label,key,minus,plus,val,dis){
  return `<div class="row"><span class="rlab">${label}</span><div class="stepper"><button ${dis&&dis.m?'disabled':''} onclick="dec('${key}',${minus})">−</button><span class="val" id="v-${key}">${val}</span><button ${dis&&dis.p?'disabled':''} onclick="dec('${key}',${plus})">+</button></div></div>`;
}
function renderDecks(){
  const d=state.dec, rem=remaining();
  const cottonMethod=state.owned.cottonDrip, orchardMethod=state.owned.orchardDrip;
  const decks=[
    // reservoir
    `<div class="deck store" id="deck-res"><div class="deck-top"><span class="deck-name">🏔 Highland dam</span><span class="deck-tag">store: ${round1(state.store)} GL</span></div>
      <div class="deck-desc">Move water through time. <b>Release</b> banked water into this season, or <b>bank</b> some of this season's flow for a harder one. Look at the forecast.</div>
      ${deckStepper("Release now","release",-1,1,d.release,{m:d.release<=0,p:d.release>=state.store})}
      ${deckStepper("Bank in dam","store",-1,1,d.store,{m:d.store<=0,p:d.store>=Math.min(RES.cap-state.store,Math.max(0,rem))})}</div>`,
    // cotton
    `<div class="deck farm" id="deck-cotton"><div class="deck-top"><span class="deck-name">🌾 Cotton district</span><span class="deck-tag">${cottonMethod?'drip':'flood'} · needs ${need('cotton')} GL</span></div>
      <div class="deck-desc">${esc(DISTRICTS.cotton.desc)}</div>
      ${deckStepper("Give water","cotton",-1,1,d.cotton,{m:d.cotton<=0,p:rem<=0})}
      <div class="row"><span class="rlab">Method</span>${cottonMethod?`<span class="pill owned">drip installed ✓</span>`:`<button class="pill" onclick="install('cotton')">Install drip <span class="cost">−$${DISTRICTS.cotton.dripCost}M</span></button> <span class="muted">(same crop on less water)</span>`}</div></div>`,
    // orchard
    `<div class="deck farm" id="deck-orchard"><div class="deck-top"><span class="deck-name">🍊 Orchard district</span><span class="deck-tag">${orchardMethod?'drip':'flood'} · needs ${need('orchard')} GL</span></div>
      <div class="deck-desc">${esc(DISTRICTS.orchard.desc)}</div>
      ${deckStepper("Give water","orchard",-1,1,d.orchard,{m:d.orchard<=0,p:rem<=0})}
      <div class="row"><span class="rlab">Method</span>${orchardMethod?`<span class="pill owned">drip installed ✓</span>`:`<button class="pill" onclick="install('orchard')">Install drip <span class="cost">−$${DISTRICTS.orchard.dripCost}M</span></button>`}</div></div>`,
    // town
    `<div class="deck town" id="deck-town"><div class="deck-top"><span class="deck-name">🏘 Willow Bend</span><span class="deck-tag">demand: ${townDemand()} GL</span></div>
      <div class="deck-desc">Meet the town's demand — or cut the demand. <b>Recycling</b> costs money once; <b>restrictions</b> cost goodwill each season.</div>
      ${deckStepper("Give water","townSupply",-1,1,d.townSupply,{m:d.townSupply<=0,p:rem<=0||d.townSupply>=townDemand()})}
      <div class="row"><span class="rlab">Measures</span>${state.owned.recycle?`<span class="pill owned">recycling ✓</span>`:`<button class="pill" onclick="install('recycle')">Recycling plant <span class="cost">−$${TOWN.recycleCost}M</span></button>`}
        ${[0,1,2].map(r=>`<button class="pill ${d.restrict===r?'on':''}" onclick="setRestrict(${r})">Restrict L${r}</button>`).join("")}</div></div>`,
    // cultural + environmental note
    `<div class="deck culture" id="deck-hole"><div class="deck-top"><span class="deck-name">💧 Cultural flow (billabong)</span><span class="deck-tag">dries below ${MODEL.waterholeMin} GL</span></div>
      <div class="deck-desc">The sacred waterhole is a <b>billabong — a cut-off river bend</b>. It gets <b>only</b> the water you deliberately send it. Whatever you don't allocate flows on as the <b>environmental flow</b> to the wetland.</div>
      ${deckStepper("Release for the billabong","culture",-1,1,d.culture,{m:d.culture<=0,p:rem<=0})}</div>`,
  ];
  document.getElementById("decks").innerHTML=decks.join("");
  refresh();
}
function dec(key,delta){
  const d=state.dec;
  if(key==="release"){ d.release=clamp(d.release+delta,0,state.store); }
  else if(key==="store"){ d.store=clamp(d.store+delta,0,Math.min(RES.cap-state.store, d.store+Math.max(0,remaining()))); }
  else { const rem=remaining(); if(delta>0&&rem<=0)return; d[key]=Math.max(0,d[key]+delta); if(key==="townSupply") d[key]=Math.min(d[key],townDemand()); }
  renderDecks();
}
function setRestrict(r){ state.dec.restrict=r; state.dec.townSupply=Math.min(state.dec.townSupply,townDemand(r)); renderDecks(); }
function install(what){
  const cost = what==="recycle"?TOWN.recycleCost:DISTRICTS[what].dripCost;
  if(state.budget<cost){ flash("Not enough budget — the farms need to earn more first."); return; }
  state.budget=round1(state.budget-cost);
  if(what==="recycle") state.owned.recycle=true; else state.owned[what+"Drip"]=true;
  document.getElementById("g-budget").textContent="$"+round1(state.budget)+"M";
  renderDecks();
}
function flash(msg){ const h=document.getElementById("planhint"); if(h){ h.textContent=msg; setTimeout(()=>{if(h.textContent===msg)h.textContent="";},2600);} }
function refresh(){
  BUCKETSsafe();
  if(document.getElementById("mapframe")) document.getElementById("mapframe").innerHTML=drawMap();
  if(document.getElementById("accounting")) document.getElementById("accounting").innerHTML=accountingHtml();
  const gb=document.getElementById("g-budget"); if(gb) gb.textContent="$"+round1(state.budget)+"M";
}
function BUCKETSsafe(){}

/* ================= RUN → CONSEQUENCE ================= */
function narrativeFor(r){
  const d=r.dec;
  let s=`This season <b>${round1(r.av)} GL</b> was available (inflow, the tributary${d.release?`, plus ${d.release} released from the dam`:""}). `;
  if(d.store) s+=`You banked <b>${d.store} GL</b> for later. `;
  if(state.owned.cottonDrip||state.owned.orchardDrip) s+=`Your drip irrigation stretched the crop water. `;
  s+= r.env>=MODEL.wetlandNeed*0.8 ? `About <b>${round1(r.env)} GL</b> reached the wetland — enough to keep it breathing. `
    : r.env>=MODEL.wetlandNeed*0.45 ? `Only about <b>${round1(r.env)} GL</b> reached the wetland — it's stressed and shallow. `
    : `Barely <b>${round1(r.env)} GL</b> reached the wetland — slow, warm, going stagnant. `;
  if(r.overTake) s+=`You took most of the water out of the river, so what's left is at real risk of algae and salt. `;
  return s;
}
function runSeason(){
  const r=runModel();
  r.narrative=narrativeFor(r);
  state.log.push(r);
  state.stage="result";
  renderResult(r);
}
function renderResult(r){
  const last=state.seasonIdx>=SEASONS.length-1;
  document.getElementById("advzone").innerHTML=renderAdvisers();
  document.getElementById("mapframe").innerHTML=drawMap();
  document.getElementById("g-store").textContent=round1(state.store)+" / "+RES.cap+" GL";
  document.getElementById("g-budget").textContent="$"+round1(state.budget)+"M";
  const meterHtml=["farm","town","river","culture"].map(k=>{ const nm={farm:"Farm economy",town:"Town wellbeing",river:"River health",culture:"Cultural & spiritual"}[k]; const v=state.meters[k],dl=r.deltas[k];
    return `<div class="meter ${k}"><div class="m-top"><span>${nm}</span><span>${v}/100</span></div><div class="m-track"><div class="m-fill" style="width:${v}%"></div></div><div class="m-delta ${dl>0?'up':(dl<0?'down':'flat')}">${dl>0?'▲ +'+dl:(dl<0?'▼ '+dl:'– no change')}</div></div>`;}).join("");
  const reactHtml=ADVISERS.map(ad=>`<div class="rcard ${ad.cls}"><span class="rc-name">${esc(ad.name)}:</span> ${ad.react[moodOf(state.meters[ad.key])]}</div>`).join("");
  const dried=r.driedNow?`<div class="alert bad"><b>The waterhole has dried.</b> It fell below the minimum, and a dried waterhole cannot simply be refilled — the cultural and spiritual loss carries through the rest of the year.</div>`:"";
  const money=`<div class="alert ${r.income>=8?'good':''}" style="${r.income>=8?'':'background:var(--bg);border:1px solid var(--line-soft)'}">The farms earned <b>$${r.income}M</b> this season. Budget now <b>$${round1(state.budget)}M</b>.</div>`;
  document.getElementById("runbtn").outerHTML="";
  document.querySelector("#scr-game .runrow").outerHTML=`
    <div class="logentry"><div class="le-head">${esc(SEASONS[state.seasonIdx].name)} — what happened</div>
      <div class="le-narr">${r.narrative}</div>${dried}${money}
      <div class="meters">${meterHtml}</div><div class="react">${reactHtml}</div>
      <div class="brief" style="border-left-color:var(--earth);margin-bottom:0"><b>Next:</b> ${SEASONS[state.seasonIdx].event}</div></div>
    <div class="runrow noprint"><span></span><button class="btn btn-primary" onclick="${last?'renderEnd()':'startSeason('+(state.seasonIdx+1)+')'}">${last?'Finish the year →':'On to '+SEASONS[state.seasonIdx+1].name+' →'}</button></div>`;
  document.querySelectorAll("#decks .stepper button, #decks .pill").forEach(b=>b.disabled=true);
  document.querySelector(".logentry").scrollIntoView({behavior:"smooth",block:"center"});
}

/* ================= VERDICT + DEBRIEF + REPORT ================= */
function verdict(){
  const M=state.meters, vals=[M.farm,M.town,M.river,M.culture], low=Math.min(...vals);
  if(vals.every(v=>v>=52)&&!state.dried) return {cls:"good",h:"A balanced year on a hard river",p:"You found water for people without letting the river or the waterhole fail — and you used your levers (efficient irrigation, the dam, town measures) to do it. On a catchment this stretched, in a year this dry, that is genuinely hard. No plan keeps everyone at the top; you kept everyone in the game."};
  if(M.farm>=62&&(M.river<38||state.dried||M.culture<38)) return {cls:"bad",h:"A boom district on a struggling river",p:"The farms did well and money moved — but it came out of the river and the waterhole, and some of that damage can't be undone. Could drip irrigation or a dam release have grown the same crop while leaving more in the river?"};
  if(M.river>=58&&M.culture>=55&&(M.farm<40||M.town<42)) return {cls:"mixed",h:"The river lived; the district struggled",p:"You protected the wetland and the waterhole — real, lasting value. But the farms and town paid for it. Was there a share — banking the wet-pulse, efficient irrigation — that kept a little more money flowing without breaking the river?"};
  if(low<32) return {cls:"bad",h:"Something was sacrificed",p:"To keep the system running you let one value fall hard. That's a real choice with real costs — name who paid, and decide whether you'd make it again."};
  return {cls:"mixed",h:"A mixed year",p:"You got some things right and paid for others. Trace each fallen bar back to a season and a choice — that's where the geography is."};
}
function renderEnd(){
  const v=verdict(), M=state.meters;
  const feelings=ADVISERS.map(ad=>`<div class="rcard ${ad.cls}"><span class="rc-name">${esc(ad.name)}</span> (${moodWord(M[ad.key])}): ${ad.react[moodOf(M[ad.key])]}</div>`).join("");
  const qs=QUESTIONS.map(q=>`<div class="saq"><div class="tie">${esc(q.tie)}</div><p class="q">${q.n}. ${q.q}</p>
    <textarea id="ta${q.n}" oninput="saveRefl(${q.n})">${esc(state.reflections[q.n]||"")}</textarea>
    <div class="saq-tools noprint"><button class="chip" onclick="toggleAid(${q.n},'scaf')">💡 Sentence starter</button><button class="chip" onclick="toggleAid(${q.n},'str')">⛰ Stretch</button><button class="chip" onclick="checkRefl(${q.n})">Check my ideas</button></div>
    <div class="scaffold" id="scaf${q.n}">${q.scaffold}</div><div class="stretchq" id="str${q.n}">${q.stretch}</div><div class="sc" id="sc${q.n}"></div></div>`).join("");
  const ladders=Object.keys(CONTINUUM).map(strand=>{ const c=CONTINUUM[strand];
    const rungs=Object.keys(c.rungs).map(Number).sort((a,b)=>a-b).map(lv=>`<button class="rung" id="rung-${strand}-${lv}" onclick="pickRung('${strand}',${lv})"><span class="r-lvl">Lvl ${lv}<span class="yearband">${bandLabel(lv)}</span></span><span class="r-txt">${esc(c.rungs[lv])}</span></button>`).join("");
    return `<h3>${esc(c.name)} <span class="progress">${esc(c.code)}</span></h3><div class="ladder" id="ladder-${strand}">${rungs}</div>`;}).join("");
  document.getElementById("scr-game").innerHTML=`
    <div class="topbar noprint"><button class="linkbtn" onclick="if(confirm('Play the whole year again?'))location.reload()">↺ play again</button><span class="progress">THE YEAR IS OVER</span></div>
    <h2 style="text-align:center">After four seasons on the river</h2>
    <div class="verdict ${v.cls}"><h3>${v.h}</h3><p>${v.p}</p></div>
    <h3>How your advisers feel now</h3><div class="react">${feelings}</div>
    <details class="reflect noprint"><summary>Reflect like a geographer</summary><div class="reflect-body"><p class="muted">Answer using what you decided and what happened. The check button only tells you which <b>ideas</b> you used — not whether your reasoning is right; that's for you and your teacher. Tap <b>Sentence starter</b> for a way in, or <b>Stretch</b> to push further.</p>${qs}</div></details>
    <details class="reflect noprint"><summary>Rate yourself on our Geography continuum</summary><div class="reflect-body"><p class="muted">Which statement best matches what <b>you</b> did? These are the same “I can…” statements your teacher uses; the year band is a guide, not a grade.</p>${ladders}</div></details>
    <div class="runrow noprint" style="justify-content:center"><button class="btn btn-primary" onclick="go('report')">Make my plan &amp; report →</button></div>`;
  window.scrollTo(0,0);
}
function saveRefl(n){ state.reflections[n]=document.getElementById("ta"+n).value; }
function toggleAid(n,which){ document.getElementById((which==="scaf"?"scaf":"str")+n).classList.toggle("show"); }
function pickRung(strand,lv){ state.self[strand]=lv; Object.keys(CONTINUUM[strand].rungs).forEach(l=>{const el=document.getElementById(`rung-${strand}-${l}`); if(el) el.classList.toggle("picked",+l===lv);}); }
function checkRefl(n){
  const q=QUESTIONS.find(x=>x.n===n), t=(state.reflections[n]||document.getElementById("ta"+n).value||"").toLowerCase(), box=document.getElementById("sc"+n);
  box.classList.add("show");
  if(t.trim().split(/\s+/).filter(Boolean).length<12){ box.innerHTML="Have a proper go first — a couple of sentences — then check."; return; }
  const hit=q.lookFor.filter(k=>t.includes(k));
  box.innerHTML=`<div><span class="ok">Ideas you used:</span> ${hit.length?esc(hit.join(", ")):"none of the key ones yet"}.</div>`+
    (hit.length>=3?`<div class="ok" style="margin-top:3px">Good range — now make sure each idea is <b>explained</b>, not just named.</div>`:`<div class="miss" style="margin-top:3px">You could also bring in ideas like: ${esc(q.lookFor.slice(0,6).join(", "))}.</div>`)+
    `<div class="muted" style="margin-top:5px">This checks which ideas you used, not whether your reasoning is correct.</div>`;
}
function vcode(str){ let h=5381; for(let i=0;i<str.length;i++){ h=((h<<5)+h+str.charCodeAt(i))>>>0; } return h.toString(36).toUpperCase().padStart(7,"0").slice(0,7); }
function renderReport(){
  const m=document.getElementById("report-body");
  state.name=(document.getElementById("rep-name")?document.getElementById("rep-name").value.trim():state.name);
  state.sid=(document.getElementById("rep-sid")?document.getElementById("rep-sid").value.trim():state.sid);
  const dt=new Date().toLocaleString("en-AU",{dateStyle:"full",timeStyle:"short"}), v=verdict(), M=state.meters;
  const seasonRows=state.log.map((r,i)=>`<tr><td>${esc(SEASONS[i].name)}</td><td>${r.dec.cotton}${state.owned.cottonDrip?' drip':''}</td><td>${r.dec.orchard}</td><td>${r.dec.townSupply}</td><td>${r.dec.culture}</td><td>${r.dec.release?'+'+r.dec.release:(r.dec.store?'−'+r.dec.store:'0')}</td><td>${round1(r.env)}</td></tr>`).join("");
  const meterRows=["farm","town","river","culture"].map(k=>{const nm={farm:"Farm economy",town:"Town wellbeing",river:"River health",culture:"Cultural & spiritual"}[k]; return `<tr><td>${nm}</td><td><b>${M[k]}/100</b></td><td>${M[k]>=60?"looked after":(M[k]>=40?"under strain":"sacrificed")}</td></tr>`;}).join("");
  const reflRows=QUESTIONS.filter(q=>(state.reflections[q.n]||"").trim()).map(q=>`<p class="muted"><b>${esc(q.tie)}</b><br>${esc(state.reflections[q.n])}</p>`).join("")||`<p class="muted"><i>No written reflection saved.</i></p>`;
  const selfRows=Object.keys(CONTINUUM).map(s=>{const lv=state.self[s]; return `<tr><td>${esc(CONTINUUM[s].name)}</td><td>${lv?`Level ${lv} · ${bandLabel(lv)}`:"—"}</td><td>${lv?`“${esc(CONTINUUM[s].rungs[lv])}”`:'<i>not rated</i>'}</td></tr>`;}).join("");
  const code=vcode(`${state.name}|${state.sid}|${["farm","town","river","culture"].map(k=>M[k]).join(",")}|${Object.keys(CONTINUUM).map(s=>state.self[s]||0).join(",")}`);
  m.innerHTML=`
    <div class="idrow noprint"><span><label>Your name</label><input id="rep-name" value="${esc(state.name)}" placeholder="e.g. Ama Osei"></span><span><label>Student ID</label><input id="rep-sid" value="${esc(state.sid)}" placeholder="e.g. KHS12345"></span><span><button class="btn btn-primary" onclick="saveAndPrint()">Save as PDF</button></span></div>
    <p class="muted noprint" style="margin-bottom:12px">Enter your name &amp; ID, click <b>Save as PDF</b>, choose “Save as PDF”, then send it to your teacher.</p>
    <h2>Share the River — my plan</h2>
    <p class="muted">${state.name?`<b>${esc(state.name)}</b>`:"<i>(name not entered)</i>"} · ID ${state.sid?`<b>${esc(state.sid)}</b>`:"<i>(not entered)</i>"} · ${dt}</p>
    <div class="verdict ${v.cls}"><h3>${v.h}</h3><p>${v.p}</p></div>
    <h3>My decisions each season (GL)</h3>
    <table class="repgrid"><tr><th>Season</th><th>Cotton</th><th>Orchard</th><th>Town</th><th>Waterhole</th><th>Dam</th><th>→ Wetland</th></tr>${seasonRows}</table>
    <p class="muted">Installed: ${[state.owned.cottonDrip?"cotton drip":"",state.owned.orchardDrip?"orchard drip":"",state.owned.recycle?"town recycling":""].filter(Boolean).join(", ")||"none"} · Final budget $${round1(state.budget)}M · Dam ${round1(state.store)}/${RES.cap} GL${state.dried?" · waterhole DRIED (irreversible)":""}</p>
    <h3>The four values at year's end</h3>
    <table class="repgrid"><tr><th>Value</th><th>Final</th><th>Verdict</th></tr>${meterRows}</table>
    <h3>My reflection</h3>${reflRows}
    <h3>My self-assessment (school continuum)</h3>
    <table class="repgrid"><tr><th>Strand</th><th>I rated myself</th><th>“I can…”</th></tr>${selfRows}</table>
    <p class="muted">Verification code: <span class="vcode">${code}</span> · Share the River</p>`;
}
function saveAndPrint(){ renderReport(); setTimeout(()=>window.print(),150); }
function selectDeck(key){ const el=document.getElementById("deck-"+(key==="wetland"?"hole":key)); if(el){ el.scrollIntoView({behavior:"smooth",block:"center"}); document.querySelectorAll(".deck").forEach(d=>d.classList.remove("sel")); el.classList.add("sel"); setTimeout(()=>el.classList.remove("sel"),1400);} }

/* ---- boot ---- */
renderIntro();
</script>
</body>
</html>
