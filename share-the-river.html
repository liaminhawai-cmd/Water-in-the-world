<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Share the River — Water in the World</title>
<style>
  :root{
    --bg:#f2ece0; --paper:#fbf7ef; --ink:#211d17; --muted:#6c6353;
    --line:#d9cfb9; --line-soft:#e8e0ce;
    --water:#2c7488; --water-d:#215866;
    --earth:#b0741f; --earth-d:#8f5d16;
    --good:#2f6a3e; --warn:#9a6b1f; --bad:#a8432f;
    --okbg:#eef4ec; --badbg:#f6ece8; --warnbg:#f6efda;
    --farm:#b0741f; --farmbg:#f4ead7;
    --town:#7a4a6f; --townbg:#f1e6ee;
    --river:#2c7488; --riverbg:#e6f0f1;
    --culture:#3f7a4a; --culturebg:#e6f1e8;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:var(--bg);
       min-height:100vh;padding:16px;display:flex;justify-content:center;align-items:flex-start;color:var(--ink)}
  .container{background:var(--paper);border:1px solid var(--line);border-radius:12px;
       max-width:1000px;width:100%;padding:22px;margin-top:12px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
  h1{text-align:center;font-size:25px;font-family:Georgia,'Times New Roman',serif;letter-spacing:.3px}
  h2{font-family:Georgia,serif;font-size:19px;margin:2px 0 8px}
  h3{font-family:Georgia,serif;font-size:15px;margin:14px 0 7px}
  .subtitle{color:var(--muted);text-align:center;margin:6px 0 14px;font-size:13px}
  .muted{color:var(--muted);font-size:13px;line-height:1.6}
  .screen{display:none}.screen.active{display:block}
  button{font-family:inherit}
  .btn{padding:11px 18px;border:1px solid var(--line);border-radius:8px;font-size:15px;font-weight:600;
       cursor:pointer;background:var(--paper);color:var(--ink);transition:all .15s ease}
  .btn-primary{background:var(--water);color:#fff;border-color:var(--water)}
  .btn-primary:hover:not(:disabled){background:var(--water-d)}
  .btn-primary:disabled{background:var(--line);border-color:var(--line);color:var(--muted);cursor:not-allowed}
  .btn-ghost{background:var(--bg);color:var(--muted)}
  .btn-ghost:hover{color:var(--ink);border-color:var(--ink)}
  .linkbtn{background:none;border:none;color:var(--water-d);font-weight:600;font-size:13px;cursor:pointer;padding:4px 8px}
  .linkbtn:hover{text-decoration:underline}
  button:focus-visible,[tabindex]:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--water);outline-offset:2px}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}

  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .progress{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.4px}
  .brief{background:var(--bg);border:1px solid var(--line-soft);border-left:4px solid var(--water);
       border-radius:8px;padding:13px 16px;margin:10px 0;font-size:14px;line-height:1.65}
  .brief b{color:var(--water-d)}
  .note{font-size:12px;color:var(--muted);font-style:italic;line-height:1.55}

  /* ---- advisers ---- */
  .advisers{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0}
  @media(max-width:680px){.advisers{grid-template-columns:1fr}}
  .adv{border:1px solid var(--line-soft);border-top:4px solid var(--line);border-radius:9px;padding:11px 13px;background:var(--paper)}
  .adv.farm{border-top-color:var(--farm)} .adv.town{border-top-color:var(--town)}
  .adv.river{border-top-color:var(--river)} .adv.culture{border-top-color:var(--culture)}
  .adv.hydro{border-top-color:var(--muted)}
  .adv-top{display:flex;align-items:center;gap:9px}
  .adv-face{width:34px;height:34px;flex:0 0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--bg);border:1px solid var(--line)}
  .adv-name{font-weight:700;font-size:13.5px}
  .adv-role{font-size:11px;color:var(--muted)}
  .adv-mood{margin-left:auto;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;padding:2px 8px;border-radius:11px;color:#fff}
  .adv-bar{height:6px;background:var(--line-soft);border-radius:99px;overflow:hidden;margin:7px 0 0}
  .adv-bar span{display:block;height:100%;border-radius:99px;transition:width .5s}
  .adv-say{font-size:12.5px;line-height:1.5;margin-top:7px}
  .adv-consult{margin-top:7px}
  .adv-consult .linkbtn{padding:2px 0}
  .adv-full{display:none;margin-top:7px;border-top:1px dashed var(--line-soft);padding-top:7px}
  .adv-full.open{display:block}
  .adv-full p{font-size:12.5px;line-height:1.55;margin-bottom:6px;color:var(--ink)}
  .adv-wants{font-size:12px;color:var(--muted);margin-top:4px}
  .adv-wants b{color:var(--ink)}

  /* ---- map ---- */
  .mapwrap{border:1px solid var(--line-soft);border-radius:10px;background:#e9f1f2;padding:8px;margin:10px 0 6px}
  .mapwrap svg{width:100%;height:auto;display:block}
  .mapcap{font-size:12.5px;color:var(--muted);background:var(--bg);border-radius:6px;padding:8px 11px;line-height:1.55;min-height:34px;margin-bottom:8px}

  /* ---- allocation ---- */
  .seasonhead{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:8px;border-bottom:2px solid var(--line-soft);padding-bottom:7px;margin:8px 0 10px}
  .seasonhead .s-name{font-family:Georgia,serif;font-size:20px;font-weight:700}
  .seasonhead .s-sub{color:var(--muted);font-size:13px}
  .seasonhead .s-inflow{font-size:12px;font-weight:700;color:var(--muted)}
  .budget{display:flex;align-items:center;gap:12px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin:8px 0;flex-wrap:wrap}
  .budget .lab{font-weight:700;font-size:13.5px}
  .budget .bar{flex:1;min-width:150px;height:13px;background:var(--line-soft);border-radius:99px;overflow:hidden}
  .budget .fill{height:100%;background:var(--water);border-radius:99px;transition:width .2s}
  .budget .num{font-family:Georgia,serif;font-weight:700;font-size:16px;white-space:nowrap}
  .allocgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:8px 0}
  @media(max-width:680px){.allocgrid{grid-template-columns:1fr}}
  .alloc{border:1px solid var(--line-soft);border-radius:10px;padding:11px 13px;background:var(--paper);border-left:5px solid}
  .alloc.farm{border-left-color:var(--farm)} .alloc.town{border-left-color:var(--town)}
  .alloc.river{border-left-color:var(--river)} .alloc.culture{border-left-color:var(--culture)}
  .alloc .a-name{font-weight:700;font-size:14px}
  .alloc .a-who{font-size:11px;color:var(--muted);float:right}
  .alloc .a-desc{font-size:11.5px;color:var(--muted);line-height:1.5;margin:5px 0 8px;clear:both}
  .stepper{display:flex;align-items:center;gap:10px}
  .stepper button{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-size:20px;font-weight:800;cursor:pointer;color:var(--ink)}
  .stepper button:hover:not(:disabled){border-color:var(--water)}
  .stepper button:disabled{opacity:.35;cursor:not-allowed}
  .stepper .val{font-family:Georgia,serif;font-size:19px;font-weight:700;min-width:40px;text-align:center}
  .stepper .need{font-size:11px;color:var(--muted)}

  /* ---- season log (consequences accumulate) ---- */
  .runrow{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
  .logentry{border:1px solid var(--line-soft);border-radius:10px;padding:13px 15px;margin:10px 0;background:var(--paper)}
  .logentry .le-head{font-family:Georgia,serif;font-weight:700;font-size:15px;margin-bottom:6px}
  .le-narr{font-size:13.5px;line-height:1.6;margin-bottom:8px}
  .le-narr b{color:var(--water-d)}
  .meters{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:8px 0}
  @media(max-width:680px){.meters{grid-template-columns:1fr}}
  .meter{border:1px solid var(--line-soft);border-radius:8px;padding:7px 10px;background:var(--bg)}
  .meter .m-top{display:flex;justify-content:space-between;font-size:12px;font-weight:700}
  .meter .m-track{height:8px;background:var(--line-soft);border-radius:99px;overflow:hidden;margin:5px 0 2px}
  .meter .m-fill{height:100%;border-radius:99px;transition:width .6s}
  .meter.farm .m-fill{background:var(--farm)} .meter.town .m-fill{background:var(--town)}
  .meter.river .m-fill{background:var(--river)} .meter.culture .m-fill{background:var(--culture)}
  .meter .m-delta{font-size:10.5px;font-weight:700}
  .m-delta.up{color:var(--good)} .m-delta.down{color:var(--bad)} .m-delta.flat{color:var(--muted)}
  .alert{border-radius:8px;padding:9px 12px;margin:7px 0;font-size:12.5px;line-height:1.5}
  .alert.bad{background:var(--badbg);border:1px solid var(--bad)}
  .react{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
  @media(max-width:680px){.react{grid-template-columns:1fr}}
  .rcard{border:1px solid var(--line-soft);border-left:3px solid;border-radius:7px;padding:8px 10px;font-size:12px;line-height:1.45}
  .rcard.farm{border-left-color:var(--farm)} .rcard.town{border-left-color:var(--town)}
  .rcard.river{border-left-color:var(--river)} .rcard.culture{border-left-color:var(--culture)}
  .rcard .rc-name{font-weight:700}

  /* ---- verdict ---- */
  .verdict{border-radius:10px;padding:16px;margin:12px 0;border:1px solid}
  .verdict.good{background:var(--okbg);border-color:var(--good)}
  .verdict.mixed{background:var(--warnbg);border-color:var(--warn)}
  .verdict.bad{background:var(--badbg);border-color:var(--bad)}
  .verdict h3{margin:0 0 6px;font-size:18px}
  .verdict p{font-size:14px;line-height:1.6}

  /* ---- reflection (opt-in, non-grading) ---- */
  details.reflect{border:1px solid var(--line);border-radius:10px;margin:12px 0;background:var(--paper)}
  details.reflect>summary{cursor:pointer;font-family:Georgia,serif;font-weight:700;font-size:16px;padding:13px 16px;list-style:none}
  details.reflect>summary::-webkit-details-marker{display:none}
  details.reflect>summary::before{content:"▸ ";color:var(--water)}
  details.reflect[open]>summary::before{content:"▾ "}
  .reflect-body{padding:0 16px 14px}
  .saq{border-top:1px solid var(--line-soft);padding:12px 0}
  .saq .tie{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
  .saq .q{font-size:14.5px;line-height:1.55;margin:5px 0 4px}
  .saq textarea{width:100%;font-family:inherit;font-size:14px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);resize:vertical;min-height:64px}
  .saq-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .chip{font-size:11.5px;font-weight:600;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:5px 11px;cursor:pointer;color:var(--muted)}
  .chip:hover{border-color:var(--water);color:var(--water-d)}
  .scaffold{background:var(--warnbg);border:1px solid #e2c79a;border-radius:8px;padding:9px 12px;margin-top:6px;font-size:12.5px;line-height:1.55;display:none}
  .scaffold.show{display:block}
  .stretchq{background:var(--riverbg);border:1px solid #b9d2da;border-radius:8px;padding:9px 12px;margin-top:6px;font-size:12.5px;line-height:1.55;display:none}
  .stretchq.show{display:block}
  .sc{font-size:12.5px;line-height:1.55;margin-top:7px;padding:9px 12px;border-radius:8px;background:var(--bg);display:none}
  .sc.show{display:block}
  .sc .ok{color:var(--good);font-weight:700} .sc .miss{color:var(--warn)}

  /* ---- self-assessment ladder ---- */
  .ladder{display:flex;flex-direction:column;gap:5px;margin:8px 0}
  .rung{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line-soft);border-radius:8px;padding:9px 11px;background:var(--paper);cursor:pointer;text-align:left;width:100%}
  .rung:hover{border-color:var(--water)}
  .rung.picked{border-color:var(--water);background:var(--riverbg)}
  .rung .r-lvl{font-family:Georgia,serif;font-weight:800;font-size:12px;color:var(--muted);flex-shrink:0;width:52px}
  .rung .r-txt{font-size:12.5px;line-height:1.4}
  .yearband{font-size:10px;font-weight:800;color:var(--muted);margin-left:4px}

  /* ---- report ---- */
  .repgrid{width:100%;border-collapse:collapse;margin:8px 0}
  .repgrid th,.repgrid td{border:1px solid var(--line);padding:7px 9px;font-size:12.5px;text-align:left;vertical-align:top}
  .repgrid th{background:var(--bg);font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted)}
  .idrow{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0;align-items:flex-end}
  .idrow label{font-size:12px;font-weight:700;color:var(--muted);display:block;margin-bottom:4px}
  .idrow input{padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:15px;font-family:inherit;background:#fff}
  .vcode{font-family:'Courier New',monospace;font-size:13px;letter-spacing:2px}
  @media print{ body{background:#fff;padding:0} .container{border:none;box-shadow:none;max-width:100%;padding:6px} .noprint{display:none !important} }
</style>
</head>
<body>
<div class="container">
<div class="screen active" id="scr-game"></div>
<div class="screen" id="scr-report">
  <div class="topbar noprint"><button class="linkbtn" onclick="location.reload()">&larr; play again</button><span class="progress">PLAN &amp; REPORT</span></div>
  <div id="report-body"></div>
</div>
</div>
<script>
"use strict";
/* ============================================================
   SHARE THE RIVER  — an authentic water-allocation simulation
   for the Year 7 "Water in the World" unit.

   Built to the pedagogy of the Coasts / Deserts / Mountains
   sims it sits beside:
   • You are a real manager making decisions under an
     IRREDUCIBLE TRADE-OFF — helping one user provably costs
     another, and no plan keeps everyone at the top.
   • Consequences EMERGE from a transparent systems model and
     are IRREVERSIBLE: a dried waterhole cannot be un-dried; a
     collapsed river recovers only slowly.
   • The knowledge lives inside the ADVISERS' own words — you
     consult them; the sim never lectures you.
   • Judgement is WITHHELD at decision time. You allocate, you
     run the season, and you read what happened.
   • Assessment is an OPT-IN, non-grading debrief that coaches
     geographic reasoning and lets you self-assess against the
     school's own continuum — it never interrupts the play.

   The place is a fictionalised single reach standing in for the
   whole Murray–Darling Basin (a deliberate simplification, named
   as such). Characters are role archetypes, not real people.
   ============================================================ */
/* ============================================================
   THE FOUR SHARES + THE MODEL
   ============================================================ */
const BUCKETS = [
  { key:"farm", cls:"farm", name:"Irrigated farms", who:"upstream", need:8, icon:"🌾",
    desc:"Cotton and citrus. This is where the district's money and jobs come from — but it's the thirstiest use, and it takes water before anyone downstream sees it." },
  { key:"town", cls:"town", name:"Willow Bend town", who:"midstream", need:4, icon:"🏘",
    desc:"3,000 people: drinking water, the hospital, homes. Needs a reliable minimum every season." },
  { key:"river", cls:"river", name:"Environmental flow", who:"the wetland", need:6, icon:"🦢",
    desc:"Water left IN the river to keep the wetland and its fish, birds and red-gums alive. Water you don't allocate also stays in the river." },
  { key:"culture", cls:"culture", name:"Cultural flow", who:"the waterhole", need:3, icon:"💧",
    desc:"Keeps the sacred waterhole full and Country healthy. Below a minimum it dries — and a dried waterhole cannot simply be refilled." },
];
const WATERHOLE_MIN = 1;

/* transparent systems model — every meter is a function of the shares you set,
   the drought, and the state you inherit. The interlocks are the whole point:
   the town leans on farm income (jobs) AND its own water AND a living river;
   the river collapses if you over-take; the waterhole dries irreversibly. */
const MODEL = {
  start:{ farm:55, town:58, river:60, culture:60 },
  overTakeThreshold:0.90,   // taking >90% of inflow stresses the river
  overTakePenalty:20,
  riverInertiaUp:0.30,      // river recovers SLOWLY (asymmetric)
  riverInertiaDown:0.65,    // but drops fast
  townFromJobs:0.35,        // share of town wellbeing that comes from farm income
  townRiverFailPenalty:16,  // a failing river fouls the town's own supply
  driedCultureCap:30,       // once the waterhole dries, cultural value can't rise above this
  cultureRiverBonus:8,      // healthy Country lifts cultural value a little
};

/* seasons: inflow shrinks into drought, then a wet pulse. Events are context,
   delivered by the hydrologist — not judgements of the player. */
const SEASONS = [
  { name:"Summer", sub:"the dry sets in", inflow:15,
    setUp:"A hot, dry summer opens the year. There is already less water than everyone has asked for.",
    event:"The Bureau says an <b>El Niño</b> is likely — a hotter, drier year ahead." },
  { name:"Autumn", sub:"El Niño confirmed", inflow:11,
    setUp:"El Niño is confirmed and inflow has dropped again.",
    event:"A heatwave lifts the town's demand and dries the soil further." },
  { name:"Winter", sub:"deep drought", inflow:8,
    setUp:"The driest winter on record for the reach. The river barely moves past the town.",
    event:"Upstream, an irrigator is caught taking more than their licence — 'water theft' makes the news." },
  { name:"Spring", sub:"a wet pulse", inflow:14,
    setUp:"Rain in the northern catchment sends a pulse downstream — a chance to let the river recover, if you choose to.",
    event:"La Niña signs appear. The drought may be breaking." },
];

/* ============================================================
   ADVISERS — the knowledge lives in their own voices.
   profile[] = what they tell you up front (consult).
   wants     = their goals, revealed on consult.
   react{}   = how they respond to YOUR actual allocation.
   The hydrologist is the neutral physics narrator (no meter).
   ============================================================ */
const HYDRO = { key:"hydro", cls:"hydro", name:"Sana O.", role:"Catchment hydrologist", icon:"📈", emblem:true,
  profile:[
    "My job is to explain how this river works, not to take a side. Here's what you're managing.",
    "Water is a <b>renewable</b> resource — the water cycle keeps re-supplying it — but the amount reaching us each season is <b>finite</b>, and in a drought it shrinks. Whatever you take out up top never reaches the users below: this river is one connected system from the farms to the waterhole.",
    "Take too much and the flow left in the river gets slow, warm and shallow — the conditions for blue-green algae and fish kills, a biological hazard that then fouls the town's own supply. Everything here is downstream of everything else."],
};
const ADVISERS = [
  { key:"farm", cls:"farm", name:"Dai N.", role:"Cotton & citrus grower", icon:"🚜",
    concern:"“The district's doing it tough. This water is our income.”",
    profile:[
      "The district has lost jobs as other work dried up, and young people are leaving. The farms are what's left.",
      "Irrigation is the biggest single use of water in Australia — and here it's where the money and the jobs are. Water on the crop means pickers in work and money moving through Willow Bend's shops.",
      "I know the river matters to others too. I'm not asking to drain it — I'm asking you not to forget that if the farms fold, the town feels it just as hard."],
    wants:"Wants enough irrigation water to keep crops and jobs alive.",
    react:{ good:"“Good on ya. That keeps the pickers on and money in the town.”",
      concern:"“It'll do, but the crop's thirsty and I'm watching every drop.”",
      bad:"“Cut like that and I lay people off. That's real, and the town wears it too.”" } },
  { key:"town", cls:"town", name:"Mayor Ellis", role:"Willow Bend council", icon:"🏛",
    concern:"“People come first — but our jobs come from the farms.”",
    profile:[
      "Three thousand people rely on me getting this right: drinking water, the hospital, the homes. We need a reliable minimum every single season.",
      "But here's the bind — a lot of our jobs come from the farms. If you starve irrigation, the town still hurts, just more slowly. And if the river turns foul, it's OUR taps that aren't safe to drink.",
      "So I'm not just asking for the town's share. I'm asking you to keep the whole system healthy enough that the town can live in it."],
    wants:"Wants secure town water AND a working farm economy AND a river clean enough to drink from.",
    react:{ good:"“Taps on, hospital running, people working. Thank you.”",
      concern:"“We're managing — just. Don't let it slip further.”",
      bad:"“The town can't run on this. Either the water or the jobs have gone.”" } },
  { key:"river", cls:"river", name:"Priya R.", role:"River ecologist", icon:"🔬",
    concern:"“Renewable doesn't mean unlimited. The wetland is a living system.”",
    profile:[
      "I read this reach as a living system. The environmental flow — the water left IN the river — keeps the Ramsar wetland alive: the fish, the waterbirds, the red-gums.",
      "Water is renewable through the cycle, but it is finite in any one season, and a wetland has limits. Pull too much and the flow goes slow, warm and shallow: blue-green algae blooms, fish die, and the damage takes years to undo — far longer than the season that caused it.",
      "And this reach is tied to places far away — the migratory birds that feed here link us to wetlands thousands of kilometres up the flyway. What you decide here doesn't stay here."],
    wants:"Wants enough environmental flow left in-stream to keep the wetland from collapsing.",
    react:{ good:"“The wetland's breathing. Birds are back on the lignum.”",
      concern:"“It's hanging on, but stressed. One more hard season could tip it.”",
      bad:"“Slow, warm, shallow water — this is how algal blooms and fish kills start. This won't bounce back by spring.”" } },
  { key:"culture", cls:"culture", name:"Aunty Marion", role:"First Nations custodian", icon:"🌏", emblem:true,
    concern:"“We belong to this river. The waterhole is a living, sacred place.”",
    profile:[
      "Our people have cared for this Country and its waters for tens of thousands of years. The waterhole here is not just a water source — it is a living place, and a sacred one.",
      "A cultural flow keeps it alive. Below a minimum it dries, and a dried waterhole is a deep loss — for Country, for food, for ceremony — and it is not simply refilled.",
      "And we ask to be part of the decision from the start — spoken with early, given the full picture, with a real say — not told after the choice is already made."],
    wants:"Wants the cultural flow kept above the minimum every season so the waterhole never dries, and to be consulted early.",
    react:{ good:"“The waterhole's alive and Country is holding. Thank you for keeping it, and for asking us.”",
      concern:"“It's holding, but only just. Country needs more than the leftovers.”",
      bad:"“The waterhole is drying. That is a living, sacred place — and this cannot simply be undone.”" } },
];

/* ============================================================

/* ================= STATE + HELPERS ================= */
const state = {
  seasonIdx:0, stage:"allocate",
  meters:Object.assign({},MODEL.start),
  dried:false,
  alloc:{farm:0,town:0,river:0,culture:0},
  log:[], consult:{}, reflections:{}, self:{}, name:"", sid:"", started:false,
};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const blend=(a,b,t)=>a*(1-t)+b*t;
const need=k=>BUCKETS.find(x=>x.key===k).need;
const sumAlloc=a=>a.farm+a.town+a.river+a.culture;
function esc(t){ const d=document.createElement("div"); d.textContent=t; return d.innerHTML; }
function go(id){ document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active")); document.getElementById("scr-"+id).classList.add("active"); window.scrollTo(0,0); if(id==="report") renderReport(); }
function moodOf(v){ return v>=60?"good":(v>=40?"concern":"bad"); }
function moodWord(v){ return v>=60?"content":(v>=40?"uneasy":"unhappy"); }
function moodColor(v){ return v>=60?"#2f6a3e":(v>=40?"#9a6b1f":"#a8432f"); }

/* ================= THE MODEL ================= */
function runModel(alloc, inflow){
  const leftover = Math.max(0, inflow - sumAlloc(alloc));
  const extraction = alloc.farm+alloc.town;
  const overTake = extraction/inflow > MODEL.overTakeThreshold;
  const farmTarget = clamp(100*Math.min(1, alloc.farm/need("farm")),0,100);
  const newFarm = Math.round(blend(state.meters.farm, farmTarget, 0.5));
  let riverTarget = 100*Math.min(1,(alloc.river+leftover)/need("river"));
  if(overTake) riverTarget -= MODEL.overTakePenalty;
  riverTarget = clamp(riverTarget,0,100);
  const inertia = riverTarget < state.meters.river ? MODEL.riverInertiaDown : MODEL.riverInertiaUp;
  const newRiver = Math.round(blend(state.meters.river, riverTarget, inertia));
  let driedNow=false;
  if(alloc.culture < WATERHOLE_MIN && !state.dried){ driedNow=true; }
  if(alloc.culture < WATERHOLE_MIN) state.dried=true;
  let cultureTarget = 100*Math.min(1, alloc.culture/need("culture"));
  if(newRiver>=60) cultureTarget += MODEL.cultureRiverBonus;
  cultureTarget = clamp(cultureTarget,0,100);
  let newCulture = Math.round(blend(state.meters.culture, cultureTarget, 0.5));
  if(state.dried) newCulture = Math.min(newCulture, MODEL.driedCultureCap);
  const townWater = 100*Math.min(1, alloc.town/need("town"));
  let townTarget = (1-MODEL.townFromJobs)*townWater + MODEL.townFromJobs*newFarm;
  if(newRiver<35) townTarget -= MODEL.townRiverFailPenalty;
  townTarget = clamp(townTarget,0,100);
  const newTown = Math.round(blend(state.meters.town, townTarget, 0.5));
  const before={...state.meters};
  state.meters={farm:newFarm,town:newTown,river:newRiver,culture:newCulture};
  const deltas={}; for(const k in before) deltas[k]=state.meters[k]-before[k];
  return { inflow, alloc:{...alloc}, leftover, extraction, overTake, driedNow, deltas, meters:{...state.meters} };
}

/* ================= LIVE MAP ================= */
function drawMap(){
  const inflow=SEASONS[state.seasonIdx].inflow, a=state.alloc;
  const reachFrac = clamp((inflow-(a.farm+a.town))/inflow,0,1);
  const riverInput=a.river+Math.max(0,inflow-sumAlloc(a));
  const wetOK = riverInput>=need("river")*0.6 && state.meters.river>=40;
  const farmOK = a.farm>=need("farm")*0.5;
  const townOK = a.town>=need("town")*0.5;
  const waterCol = state.meters.river>=60?"#2c7488":(state.meters.river>=40?"#5a94a2":"#9bb6b8");
  const upW=14, downW=Math.max(3, 3+11*reachFrac);
  const wh = state.dried
    ? `<g><ellipse cx="838" cy="150" rx="20" ry="12" fill="#d8c08a" stroke="#a98b4f" stroke-width="2"/>
       <path d="M824 150 h28 M838 142 v16" stroke="#a98b4f" stroke-width="1.5"/><text x="838" y="188" text-anchor="middle" font-size="11" fill="#8a5a0c" font-family="Georgia,serif">waterhole — dried</text></g>`
    : `<g><ellipse cx="838" cy="150" rx="${8+8*Math.min(1,a.culture/need('culture'))}" ry="${5+5*Math.min(1,a.culture/need('culture'))}" fill="#7fb0d4" stroke="#2c7488" stroke-width="1.6"/><text x="838" y="188" text-anchor="middle" font-size="11" fill="#215866" font-family="Georgia,serif">waterhole</text></g>`;
  const nodes=[
    {x:150,label:"Irrigated farms",icon:"🌾",lit:farmOK},
    {x:370,label:"Willow Bend",icon:"🏘",lit:townOK},
    {x:600,label:"Wetland",icon:wetOK?"🦢":"🥀",lit:wetOK},
  ];
  const nodeSvg=nodes.map(n=>`
    <line x1="${n.x}" y1="150" x2="${n.x}" y2="120" stroke="#8a8577" stroke-width="1.4"/>
    <circle cx="${n.x}" cy="98" r="21" fill="${n.lit?'#fbf7ef':'#efe7d5'}" stroke="#8a8577" stroke-width="1.6" opacity="${n.lit?1:0.7}"/>
    <text x="${n.x}" y="105" text-anchor="middle" font-size="19" opacity="${n.lit?1:0.5}">${n.icon}</text>
    <text x="${n.x}" y="176" text-anchor="middle" font-size="11.5" font-weight="700" fill="#211d17" font-family="ui-sans-serif,system-ui">${n.label}</text>`).join("");
  return `<svg viewBox="0 0 900 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="River from upstream farms to the downstream waterhole; it thins as water is taken">
    <path d="M20 150 h300" fill="none" stroke="${waterCol}" stroke-width="${upW}" stroke-linecap="round"/>
    <path d="M320 150 H820" fill="none" stroke="${waterCol}" stroke-width="${downW}" stroke-linecap="round" opacity="${0.5+0.5*reachFrac}"/>
    <text x="26" y="140" font-size="11" fill="#215866" font-family="Georgia,serif">upstream ▶</text>
    ${wh}${nodeSvg}
  </svg>`;
}
function mapCaption(){
  const a=state.alloc, inflow=SEASONS[state.seasonIdx].inflow;
  const reaching=Math.max(0,inflow-(a.farm+a.town));
  if(sumAlloc(a)===0) return "The river flows from the upstream farms down to the wetland and the waterhole. Whatever you take up top never reaches the users below. Set your shares and watch the river downstream.";
  return `You're taking <b>${a.farm+a.town} GL</b> out for farms and town, so about <b>${reaching} GL</b> is left flowing downstream toward the wetland and the waterhole.`;
}

/* ================= ADVISERS ================= */

function toggleConsult(key){ state.consult[key]=!state.consult[key]; document.getElementById("advzone").innerHTML=renderAdvisers(); }

/* ================= INTRO ================= */
function renderIntro(){
  document.getElementById("scr-game").innerHTML=`

/* ================= SEASON — ALLOCATE ================= */
function startSeason(idx){
  state.started=true; state.seasonIdx=idx; state.stage="allocate";
  state.alloc={farm:0,town:0,river:0,culture:0};
  renderSeason();
}
function renderSeason(){
  const se=SEASONS[state.seasonIdx];
  const g=document.getElementById("scr-game");
  g.innerHTML=`
    <div class="topbar noprint"><button class="linkbtn" onclick="if(confirm('Restart the whole year?'))location.reload()">↺ restart</button><span class="progress">SEASON ${state.seasonIdx+1} / 4 · ${esc(se.name.toUpperCase())}</span></div>
    <div class="seasonhead"><div><div class="s-name">${esc(se.name)}</div><div class="s-sub">${esc(se.sub)}</div></div>
      <div class="s-inflow">Inflow to share: <b style="font-size:16px;color:var(--water-d)">${se.inflow} GL</b></div></div>
    <p class="muted" style="margin-bottom:6px">${se.setUp}</p>
    <div id="advzone">${renderAdvisers()}</div>
    <div class="mapwrap" id="mapwrap">${drawMap()}</div>
    <div class="mapcap" id="mapcap">${mapCaption()}</div>
    <div id="actionzone"></div>`;
  renderAllocate();
}
function renderAllocate(){
  const se=SEASONS[state.seasonIdx];
  const grid=BUCKETS.map(b=>`
    <div class="alloc ${b.cls}"><span class="a-who">${esc(b.who)}</span><div class="a-name">${b.icon} ${esc(b.name)}</div>
      <div class="a-desc">${esc(b.desc)}</div>
      <div class="stepper"><button aria-label="less" onclick="stepAlloc('${b.key}',-1)">−</button>
        <span class="val" id="val-${b.key}">0</span>
        <button aria-label="more" id="plus-${b.key}" onclick="stepAlloc('${b.key}',1)">+</button>
        <span class="need">needs ~${b.need} GL</span></div></div>`).join("");
  document.getElementById("actionzone").innerHTML=`
    <h3>Divide the ${se.inflow} GL</h3>
    <div class="budget"><span class="lab">Still to share</span><span class="bar"><span class="fill" id="budfill" style="width:100%"></span></span><span class="num" id="budnum">${se.inflow} / ${se.inflow} GL</span></div>
    <div class="allocgrid">${grid}</div>
    <div class="runrow"><span class="muted">Water you leave unallocated flows on downstream and helps the river.</span>
      <button class="btn btn-primary" id="runbtn" onclick="runSeason()">Run ${esc(se.name)} →</button></div>`;
  refreshAlloc();
}
function stepAlloc(key,d){ const se=SEASONS[state.seasonIdx]; const rem=se.inflow-sumAlloc(state.alloc); if(d>0&&rem<=0)return; state.alloc[key]=clamp(state.alloc[key]+d,0,se.inflow); refreshAlloc(); }
function refreshAlloc(){
  const se=SEASONS[state.seasonIdx], rem=se.inflow-sumAlloc(state.alloc);
  BUCKETS.forEach(b=>{ document.getElementById("val-"+b.key).textContent=state.alloc[b.key]; document.getElementById("plus-"+b.key).disabled=rem<=0; });
  document.getElementById("budfill").style.width=(100*rem/se.inflow)+"%";
  document.getElementById("budnum").textContent=`${rem} / ${se.inflow} GL`;
  document.getElementById("mapwrap").innerHTML=drawMap();
  document.getElementById("mapcap").innerHTML=mapCaption();
}

/* ================= RUN → CONSEQUENCE ================= */
function narrativeFor(r){
  const a=r.alloc;
  const reaching=a.river+r.leftover;
  let s=`This season you split the <b>${r.inflow} GL</b>: ${a.farm} to the farms, ${a.town} to the town, ${a.river} to the river and ${a.culture} to the waterhole${r.leftover?`, with ${r.leftover} left to flow on`:""}. `;
  s+= reaching>=need("river")*0.8 ? `About <b>${reaching} GL</b> reached the wetland — enough to keep it breathing. `
     : reaching>=need("river")*0.45 ? `Only about <b>${reaching} GL</b> reached the wetland — it's stressed and shallow. `
     : `Barely <b>${reaching} GL</b> reached the wetland — the water there is slow, warm and going stagnant. `;
  if(r.overTake) s+=`You took most of the inflow out of the river, so what's left downstream is at real risk of algae. `;
  return s;
}
function runSeason(){
  const se=SEASONS[state.seasonIdx];
  const r=runModel(state.alloc, se.inflow);
  r.narrative=narrativeFor(r);
  state.log.push(r);
  state.stage="result";
  document.getElementById("advzone").innerHTML=renderAdvisers();
  document.getElementById("mapwrap").innerHTML=drawMap();
  renderResult(r);
}
function renderResult(r){
  const last = state.seasonIdx>=SEASONS.length-1;
  const meterHtml=BUCKETS.map(b=>{ const v=state.meters[b.key], d=r.deltas[b.key];
    return `<div class="meter ${b.cls}"><div class="m-top"><span>${esc(b.name)}</span><span>${v}/100</span></div>
      <div class="m-track"><div class="m-fill" style="width:${v}%"></div></div>
      <div class="m-delta ${d>0?'up':(d<0?'down':'flat')}">${d>0?'▲ +'+d:(d<0?'▼ '+d:'– no change')}</div></div>`;}).join("");
  const reactHtml=ADVISERS.map(ad=>{ const v=state.meters[ad.key];
    return `<div class="rcard ${ad.cls}"><span class="rc-name">${esc(ad.name)}:</span> ${ad.react[moodOf(v)]}</div>`;}).join("");
  const driedAlert = r.driedNow ? `<div class="alert bad"><b>The waterhole has dried.</b> You gave it less than the minimum, and a dried waterhole cannot simply be refilled — the cultural and spiritual loss carries through the rest of the year.</div>` : "";
  document.getElementById("actionzone").innerHTML=`
    <div class="logentry"><div class="le-head">${esc(SEASONS[state.seasonIdx].name)} — what happened</div>
      <div class="le-narr">${r.narrative}</div>
      ${driedAlert}
      <div class="meters">${meterHtml}</div>
      <div class="react">${reactHtml}</div>
      <div class="brief" style="border-left-color:var(--earth);margin-bottom:0"><b>Next:</b> ${SEASONS[state.seasonIdx].event}</div></div>
    <div class="runrow noprint"><span></span><button class="btn btn-primary" onclick="${last?'renderEnd()':'startSeason('+(state.seasonIdx+1)+')'}">${last?'Finish the year →':'On to '+SEASONS[state.seasonIdx+1].name+' →'}</button></div>`;
  document.getElementById("actionzone").scrollIntoView({behavior:"smooth",block:"start"});
}

/* ================= VERDICT + DEBRIEF ================= */
function verdict(){
  const M=state.meters, vals=BUCKETS.map(b=>M[b.key]), avg=Math.round(vals.reduce((a,b)=>a+b,0)/4), low=Math.min(...vals);
  if(vals.every(v=>v>=52) && !state.dried) return {cls:"good",h:"A balanced year on a hard river",p:"You found water for people without letting the river or the waterhole fail. On a river this stretched, in a year this dry, that is genuinely hard — and you got close. No plan keeps everyone at the top; you kept everyone in the game."};
  if(M.farm>=62 && (M.river<38 || state.dried || M.culture<38)) return {cls:"bad",h:"A boom district on a struggling river",p:"The farms did well and money moved through the town — but it came out of the river and the waterhole. Some of that damage (a dried waterhole, a collapsing wetland) is slow or impossible to undo. Look at which bar fell furthest, and whose voice you left behind."};
  if(M.river>=58 && M.culture>=55 && (M.farm<40 || M.town<42)) return {cls:"mixed",h:"The river lived; the district struggled",p:"You protected the wetland and the waterhole — real, lasting value. But the farms and the town paid for it, and a district that empties out is its own kind of loss. Was there a share that kept a little more money flowing without breaking the river?"};
  if(low<32) return {cls:"bad",h:"Something was sacrificed",p:"To keep the system running you let one value fall hard. That's a real choice with real costs — name who paid, and decide whether you'd make it again."};
  return {cls:"mixed",h:"A mixed year",p:"You got some things right and paid for others. Trace each fallen bar back to a season and a choice — that's where the geography is."};
}
function renderEnd(){
  const v=verdict(), M=state.meters;
  const feelings=ADVISERS.map(ad=>`<div class="rcard ${ad.cls}"><span class="rc-name">${esc(ad.name)}</span> (${moodWord(M[ad.key])}): ${ad.react[moodOf(M[ad.key])]}</div>`).join("");
  const qs=QUESTIONS.map(q=>`
    <div class="saq"><div class="tie">${esc(q.tie)}</div><p class="q">${q.n}. ${q.q}</p>
      <textarea id="ta${q.n}" oninput="saveRefl(${q.n})">${esc(state.reflections[q.n]||"")}</textarea>
      <div class="saq-tools noprint"><button class="chip" onclick="toggleAid(${q.n},'scaf')">💡 Sentence starter</button>
        <button class="chip" onclick="toggleAid(${q.n},'str')">⛰ Stretch</button>
        <button class="chip" onclick="checkRefl(${q.n})">Check my ideas</button></div>
      <div class="scaffold" id="scaf${q.n}">${q.scaffold}</div>
      <div class="stretchq" id="str${q.n}">${q.stretch}</div>
      <div class="sc" id="sc${q.n}"></div></div>`).join("");
  const ladders=Object.keys(CONTINUUM).map(strand=>{
    const c=CONTINUUM[strand];
    const rungs=Object.keys(c.rungs).map(Number).sort((a,b)=>a-b).map(lv=>`
      <button class="rung" onclick="pickRung('${strand}',${lv})" id="rung-${strand}-${lv}"><span class="r-lvl">Lvl ${lv}<span class="yearband">${bandLabel(lv)}</span></span><span class="r-txt">${esc(c.rungs[lv])}</span></button>`).join("");
    return `<h3>${esc(c.name)} <span class="progress">${esc(c.code)}</span></h3><div class="ladder" id="ladder-${strand}">${rungs}</div>`;
  }).join("");
  document.getElementById("scr-game").innerHTML=`
    <div class="topbar noprint"><button class="linkbtn" onclick="if(confirm('Play the whole year again?'))location.reload()">↺ play again</button><span class="progress">THE YEAR IS OVER</span></div>
    <h2 style="text-align:center">After four seasons on the river</h2>
    <div class="verdict ${v.cls}"><h3>${v.h}</h3><p>${v.p}</p></div>
    <h3>How your advisers feel now</h3><div class="react">${feelings}</div>
    <details class="reflect noprint"><summary>Reflect like a geographer</summary>
      <div class="reflect-body"><p class="muted">Answer using what you decided and what happened. The check button only tells you which <b>ideas</b> you used — not whether your reasoning is right; that's for you and your teacher. Tap <b>Sentence starter</b> if you'd like a way in, or <b>Stretch</b> to push further.</p>${qs}</div></details>
    <details class="reflect noprint"><summary>Rate yourself on our Geography continuum</summary>
      <div class="reflect-body"><p class="muted">Which statement best matches what <b>you</b> did across the year? These are the same “I can…” statements your teacher uses — the year-level band is a guide, not a grade.</p>${ladders}</div></details>
    <div class="runrow noprint" style="justify-content:center"><button class="btn btn-primary" onclick="go('report')">Make my plan &amp; report →</button></div>`;
  window.scrollTo(0,0);
}
function saveRefl(n){ state.reflections[n]=document.getElementById("ta"+n).value; }
function toggleAid(n,which){ const el=document.getElementById((which==="scaf"?"scaf":"str")+n); el.classList.toggle("show"); }
function pickRung(strand,lv){ state.self[strand]=lv; Object.keys(CONTINUUM[strand].rungs).forEach(l=>{ const el=document.getElementById(`rung-${strand}-${l}`); if(el) el.classList.toggle("picked",+l===lv); }); }
function checkRefl(n){
  const q=QUESTIONS.find(x=>x.n===n), t=(state.reflections[n]||document.getElementById("ta"+n).value||"").toLowerCase(), box=document.getElementById("sc"+n);
  box.classList.add("show");
  if(t.trim().split(/\s+/).length<12){ box.innerHTML="Have a proper go first — a couple of sentences — then check."; return; }
  const hit=q.lookFor.filter(k=>t.includes(k));
  box.innerHTML=`<div><span class="ok">Ideas you used:</span> ${hit.length?esc(hit.join(", ")):"none of the key ones yet"}.</div>`
    + (hit.length>=3?`<div class="ok" style="margin-top:3px">Good range — now make sure each idea is <b>explained</b>, not just named.</div>`
       :`<div class="miss" style="margin-top:3px">You could also bring in ideas like: ${esc(q.lookFor.slice(0,6).join(", "))}.</div>`)
    + `<div class="muted" style="margin-top:5px">This checks which ideas you used, not whether your reasoning is correct.</div>`;
}

/* ================= REPORT ================= */
function vcode(str){ let h=5381; for(let i=0;i<str.length;i++){ h=((h<<5)+h+str.charCodeAt(i))>>>0; } return h.toString(36).toUpperCase().padStart(7,"0").slice(0,7); }
function renderReport(){
  const m=document.getElementById("report-body");
  state.name=(document.getElementById("rep-name")?document.getElementById("rep-name").value.trim():state.name);
  state.sid=(document.getElementById("rep-sid")?document.getElementById("rep-sid").value.trim():state.sid);
  const dt=new Date().toLocaleString("en-AU",{dateStyle:"full",timeStyle:"short"});
  const v=verdict(), M=state.meters;
  const seasonRows=state.log.map((r,i)=>`<tr><td>${esc(SEASONS[i].name)} (${r.inflow} GL)</td><td>${r.alloc.farm}</td><td>${r.alloc.town}</td><td>${r.alloc.river}</td><td>${r.alloc.culture}</td></tr>`).join("");
  const meterRows=BUCKETS.map(b=>`<tr><td>${esc(b.name)}</td><td><b>${M[b.key]}/100</b></td><td>${M[b.key]>=60?"looked after":(M[b.key]>=40?"under strain":"sacrificed")}</td></tr>`).join("");
  const reflRows=QUESTIONS.filter(q=>(state.reflections[q.n]||"").trim()).map(q=>`<p class="muted"><b>${esc(q.tie)}</b><br>${esc(state.reflections[q.n])}</p>`).join("") || `<p class="muted"><i>No written reflection saved.</i></p>`;
  const selfRows=Object.keys(CONTINUUM).map(s=>{ const lv=state.self[s]; return `<tr><td>${esc(CONTINUUM[s].name)}</td><td>${lv?`Level ${lv} · ${bandLabel(lv)}`:"—"}</td><td>${lv?`“${esc(CONTINUUM[s].rungs[lv])}”`:'<i>not rated</i>'}</td></tr>`; }).join("");
  const code=vcode(`${state.name}|${state.sid}|${BUCKETS.map(b=>M[b.key]).join(",")}|${Object.keys(CONTINUUM).map(s=>state.self[s]||0).join(",")}`);
  m.innerHTML=`
    <div class="idrow noprint">
      <span><label>Your name</label><input id="rep-name" value="${esc(state.name)}" placeholder="e.g. Ama Osei"></span>
      <span><label>Student ID</label><input id="rep-sid" value="${esc(state.sid)}" placeholder="e.g. KHS12345"></span>
      <span><button class="btn btn-primary" onclick="saveAndPrint()">Save as PDF</button></span></div>
    <p class="muted noprint" style="margin-bottom:12px">Enter your name &amp; ID, click <b>Save as PDF</b>, choose “Save as PDF” in the print box, then send it to your teacher.</p>
    <h2>Share the River — my plan</h2>
    <p class="muted">${state.name?`<b>${esc(state.name)}</b>`:"<i>(name not entered)</i>"} · ID ${state.sid?`<b>${esc(state.sid)}</b>`:"<i>(not entered)</i>"} · ${dt}</p>
    <div class="verdict ${v.cls}"><h3>${v.h}</h3><p>${v.p}</p></div>
    <h3>My allocations (GL)</h3>
    <table class="repgrid"><tr><th>Season</th><th>Farms</th><th>Town</th><th>River</th><th>Waterhole</th></tr>${seasonRows}</table>
    <h3>The four values at year's end</h3>
    <table class="repgrid"><tr><th>Value</th><th>Final</th><th>Verdict</th></tr>${meterRows}</table>
    ${state.dried?`<p class="muted"><b>Note:</b> the sacred waterhole dried during the year — an irreversible loss.</p>`:""}
    <h3>My reflection</h3>${reflRows}
    <h3>My self-assessment (school continuum)</h3>
    <table class="repgrid"><tr><th>Strand</th><th>I rated myself</th><th>“I can…”</th></tr>${selfRows}</table>
    <p class="muted">Verification code: <span class="vcode">${code}</span> · Share the River</p>`;
}
function saveAndPrint(){ renderReport(); setTimeout(()=>window.print(),150); }

/* ---- boot ---- */
renderIntro();
</script>
